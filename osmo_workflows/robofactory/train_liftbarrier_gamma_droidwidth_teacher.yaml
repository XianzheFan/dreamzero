            export GRIPPER_BINARY_LOGIT_SCALE="${GRIPPER_BINARY_LOGIT_SCALE:-4.0}"
            export GRIPPER_BINARY_MAX_SIGMA="${GRIPPER_BINARY_MAX_SIGMA:-0.75}"
            export BASE_ACTION_PREFIX_LOSS_WEIGHT="${ACTION_PREFIX_LOSS_WEIGHT:-2.0}"
            export ACTION_PREFIX_LOSS_LEN="${ACTION_PREFIX_LOSS_LEN:-8}"
            export BASE_ACTION_DELTA_LOSS_WEIGHT="${ACTION_DELTA_LOSS_WEIGHT:-0.2}"
            export BASE_ACTION_JERK_LOSS_WEIGHT="${ACTION_JERK_LOSS_WEIGHT:-{{action_jerk_loss_weight}}}"
            export ACTION_DELTA_MAX_SIGMA="${ACTION_DELTA_MAX_SIGMA:-0.75}"
            export ACTION_DELTA_EXCLUDE_GRIPPER="${ACTION_DELTA_EXCLUDE_GRIPPER:-true}"
            export STAGE1_DYNAMICS_LOSS_WEIGHT="${STAGE1_DYNAMICS_LOSS_WEIGHT:-2.0}"
            export STAGE1_ACTION_LOSS_WEIGHT="${STAGE1_ACTION_LOSS_WEIGHT:-1.0}"
            export STAGE1_GRIPPER_ACTION_LOSS_WEIGHT="${STAGE1_GRIPPER_ACTION_LOSS_WEIGHT:-2.0}"
            export STAGE1_GRIPPER_CLOSE_ACTION_LOSS_WEIGHT="${STAGE1_GRIPPER_CLOSE_ACTION_LOSS_WEIGHT:-2.0}"
            export STAGE1_GRIPPER_CLEAN_ACTION_LOSS_WEIGHT="${STAGE1_GRIPPER_CLEAN_ACTION_LOSS_WEIGHT:-0.5}"
            export STAGE1_GRIPPER_CLEAN_CLOSE_ACTION_LOSS_WEIGHT="${STAGE1_GRIPPER_CLEAN_CLOSE_ACTION_LOSS_WEIGHT:-2.0}"
            export STAGE1_GRIPPER_BINARY_ACTION_LOSS_WEIGHT="${STAGE1_GRIPPER_BINARY_ACTION_LOSS_WEIGHT:-1.0}"
            export STAGE1_GRIPPER_BINARY_CLOSE_ACTION_LOSS_WEIGHT="${STAGE1_GRIPPER_BINARY_CLOSE_ACTION_LOSS_WEIGHT:-2.0}"
            export STAGE1_ACTION_PREFIX_LOSS_WEIGHT="${STAGE1_ACTION_PREFIX_LOSS_WEIGHT:-1.0}"
            export STAGE1_ACTION_DELTA_LOSS_WEIGHT="${STAGE1_ACTION_DELTA_LOSS_WEIGHT:-$BASE_ACTION_DELTA_LOSS_WEIGHT}"
            export STAGE1_ACTION_JERK_LOSS_WEIGHT="${STAGE1_ACTION_JERK_LOSS_WEIGHT:-$BASE_ACTION_JERK_LOSS_WEIGHT}"
            export STAGE2_DYNAMICS_LOSS_WEIGHT="${STAGE2_DYNAMICS_LOSS_WEIGHT:-$BASE_DYNAMICS_LOSS_WEIGHT}"
            export STAGE2_ACTION_LOSS_WEIGHT="${STAGE2_ACTION_LOSS_WEIGHT:-$BASE_ACTION_LOSS_WEIGHT}"
            export STAGE2_GRIPPER_ACTION_LOSS_WEIGHT="${STAGE2_GRIPPER_ACTION_LOSS_WEIGHT:-$BASE_GRIPPER_ACTION_LOSS_WEIGHT}"
            export STAGE2_GRIPPER_CLOSE_ACTION_LOSS_WEIGHT="${STAGE2_GRIPPER_CLOSE_ACTION_LOSS_WEIGHT:-$BASE_GRIPPER_CLOSE_ACTION_LOSS_WEIGHT}"
            export STAGE2_GRIPPER_CLEAN_ACTION_LOSS_WEIGHT="${STAGE2_GRIPPER_CLEAN_ACTION_LOSS_WEIGHT:-$BASE_GRIPPER_CLEAN_ACTION_LOSS_WEIGHT}"
            export STAGE2_GRIPPER_CLEAN_CLOSE_ACTION_LOSS_WEIGHT="${STAGE2_GRIPPER_CLEAN_CLOSE_ACTION_LOSS_WEIGHT:-$BASE_GRIPPER_CLEAN_CLOSE_ACTION_LOSS_WEIGHT}"
            export STAGE2_GRIPPER_BINARY_ACTION_LOSS_WEIGHT="${STAGE2_GRIPPER_BINARY_ACTION_LOSS_WEIGHT:-$BASE_GRIPPER_BINARY_ACTION_LOSS_WEIGHT}"
            export STAGE2_GRIPPER_BINARY_CLOSE_ACTION_LOSS_WEIGHT="${STAGE2_GRIPPER_BINARY_CLOSE_ACTION_LOSS_WEIGHT:-$BASE_GRIPPER_BINARY_CLOSE_ACTION_LOSS_WEIGHT}"
            export STAGE2_ACTION_PREFIX_LOSS_WEIGHT="${STAGE2_ACTION_PREFIX_LOSS_WEIGHT:-$BASE_ACTION_PREFIX_LOSS_WEIGHT}"
            export STAGE2_ACTION_DELTA_LOSS_WEIGHT="${STAGE2_ACTION_DELTA_LOSS_WEIGHT:-$BASE_ACTION_DELTA_LOSS_WEIGHT}"
            export STAGE2_ACTION_JERK_LOSS_WEIGHT="${STAGE2_ACTION_JERK_LOSS_WEIGHT:-$BASE_ACTION_JERK_LOSS_WEIGHT}"
            export FIRST_CLOSE_JOINT_LOSS_WEIGHT="${FIRST_CLOSE_JOINT_LOSS_WEIGHT:-1.0}"
            export FIRST_CLOSE_JOINT_LOSS_WINDOW_BEFORE="${FIRST_CLOSE_JOINT_LOSS_WINDOW_BEFORE:-0}"
            export FIRST_CLOSE_JOINT_LOSS_WINDOW_AFTER="${FIRST_CLOSE_JOINT_LOSS_WINDOW_AFTER:-0}"
            # Gamma-style RoPE/agent augmentation is for new training runs.
            # Do not resume a legacy agent_dim=16 checkpoint unless these
            # are overridden back to the legacy values.
            export ROPE_AGENT_DIM="${ROPE_AGENT_DIM:-gamma}"
            export MULTI_AGENT_SHUFFLE_AGENTS="${MULTI_AGENT_SHUFFLE_AGENTS:-true}"
            export MULTI_AGENT_SAMPLE_AGENT_POOL="${MULTI_AGENT_SAMPLE_AGENT_POOL:-true}"
            export GLOBAL_VIDEO_DROPOUT_PROB="${GLOBAL_VIDEO_DROPOUT_PROB:-0.0}"
            export GLOBAL_VIDEO_TIMESTEP_MODE="${GLOBAL_VIDEO_TIMESTEP_MODE:-clean}"
            export GLOBAL_VIDEO_ATTENTION_MODE="${GLOBAL_VIDEO_ATTENTION_MODE:-bidirectional}"
            export ATTENTION_BACKEND="${ATTENTION_BACKEND:-flex}"
            export CHECKPOINT_SLIM_INTERVAL_SECONDS="${CHECKPOINT_SLIM_INTERVAL_SECONDS:-30}"
            export PRESERVE_LOCAL_DEEPSPEED_CHECKPOINTS="${PRESERVE_LOCAL_DEEPSPEED_CHECKPOINTS:-true}"
            export UPLOAD_STRICT_RESUME_CHECKPOINTS="${UPLOAD_STRICT_RESUME_CHECKPOINTS:-true}"
            export REPORT_TO=wandb
            export WANDB_PROJECT=dreamzero_robofactory
            export DATALOADER_NUM_WORKERS=4
            export ROBOFACTORY_DATA_ROOT="$DATA_ROOT"
            export BASE_OUTPUT_DIR="${BASE_OUTPUT_DIR:-/workspace/outputs/robofactory_liftbarrier_gamma_droidwidth_teacher}"
            export STAGE1_OUTPUT_DIR="${STAGE1_OUTPUT_DIR:-${BASE_OUTPUT_DIR}/teacher}"
            export STAGE2_OUTPUT_DIR="${STAGE2_OUTPUT_DIR:-${BASE_OUTPUT_DIR}/sparse_student}"
            export OUTPUT_DIR="${BASE_OUTPUT_DIR}/bootstrap"
            export WAN_CKPT_DIR
            export TOKENIZER_DIR
            export PRETRAINED_DIR
            mkdir -p "$BASE_OUTPUT_DIR" "$OUTPUT_DIR"

            is_complete_minimal_checkpoint() {
              ckpt_dir="$1"
              [ -f "${ckpt_dir}/trainer_state.json" ] && \
                [ -f "${ckpt_dir}/experiment_cfg/conf.yaml" ] && \
                { [ -f "${ckpt_dir}/model.safetensors" ] || [ -f "${ckpt_dir}/model.safetensors.index.json" ]; }
            }

            copy_minimal_checkpoint() {
              src_dir="$1"
              dst_dir="$2"
              rm -rf "$dst_dir"
              mkdir -p "$dst_dir"
              for item in model.safetensors model.safetensors.index.json trainer_state.json config.json wandb_config.json latest; do
                if [ -e "${src_dir}/${item}" ]; then
                  cp -a "${src_dir}/${item}" "$dst_dir/"
                fi
              done
              if [ -d "${src_dir}/experiment_cfg" ]; then
                cp -a "${src_dir}/experiment_cfg" "$dst_dir/"
              fi
              touch "${dst_dir}/.cache_complete"
            }

            slim_checkpoint_once() {
              ckpt_dir="$1"
              if is_truthy "$PRESERVE_LOCAL_DEEPSPEED_CHECKPOINTS"; then
                return 0
              fi
              if ! is_complete_minimal_checkpoint "$ckpt_dir"; then
                return 0
              fi
              if [ -f "${ckpt_dir}/.dreamzero_slimmed" ]; then
                return 0
              fi
              echo "Slimming checkpoint ${ckpt_dir} to model/config/trainer metadata only"
              find "$ckpt_dir" -mindepth 1 -maxdepth 1 \
                ! -name 'model.safetensors' \
                ! -name 'model.safetensors.index.json' \
                ! -name 'trainer_state.json' \
                ! -name 'config.json' \
                ! -name 'wandb_config.json' \
                ! -name 'latest' \
                ! -name 'experiment_cfg' \
                ! -name '.cache_complete' \
                ! -name '.dreamzero_slimmed' \
                -exec rm -rf {} +
              touch "${ckpt_dir}/.dreamzero_slimmed"
              du -sh "$ckpt_dir" || true
            }

            slim_checkpoints_once() {
              while IFS= read -r ckpt_dir; do
                [ -n "$ckpt_dir" ] || continue
                slim_checkpoint_once "$ckpt_dir"
              done < <(find "$OUTPUT_DIR" -maxdepth 1 -type d -name 'checkpoint-*' | sort -V)
            }

            is_complete_strict_resume_checkpoint() {
              ckpt_dir="$1"
              is_complete_minimal_checkpoint "$ckpt_dir" || return 1
              if [ ! -f "${ckpt_dir}/latest" ]; then
                return 1
              fi
              ds_marker="$(find "$ckpt_dir" -mindepth 1 \( \
                -type d -name 'global_step*' -o \
                -type f -name 'zero_pp_rank_*' -o \
                -type f -name '*optim_states.pt' -o \
                -type f -name '*model_states.pt' \
              \) -print -quit 2>/dev/null || true)"
              [ -n "$ds_marker" ]
            }

            stage_resume_checkpoints_for_upload() {
              if ! is_truthy "$UPLOAD_STRICT_RESUME_CHECKPOINTS"; then
                echo "Strict resume checkpoint upload disabled by UPLOAD_STRICT_RESUME_CHECKPOINTS=${UPLOAD_STRICT_RESUME_CHECKPOINTS}."
                return 1
              fi

              stage_root="/workspace/rf_resume_checkpoint_upload"
              stage_dir="${stage_root}/${RUN_NAME}"
              rm -rf "$stage_dir"
              mkdir -p "$stage_dir"

              for top_file in wandb_config.json loss_log.jsonl; do
                if [ -f "${OUTPUT_DIR}/${top_file}" ]; then
                  cp -a "${OUTPUT_DIR}/${top_file}" "$stage_dir/"
                fi
              done
              if [ -d "${OUTPUT_DIR}/experiment_cfg" ]; then
                cp -a "${OUTPUT_DIR}/experiment_cfg" "$stage_dir/"
              fi

              found=0
              while IFS= read -r ckpt_dir; do
                [ -n "$ckpt_dir" ] || continue
                ckpt_name="$(basename "$ckpt_dir")"
                if is_complete_strict_resume_checkpoint "$ckpt_dir"; then
                  echo "Staging strict resume checkpoint ${ckpt_dir}"
                  if ! cp -al "$ckpt_dir" "${stage_dir}/${ckpt_name}" 2>/dev/null; then
                    cp -a "$ckpt_dir" "${stage_dir}/${ckpt_name}"
                  fi
                  found=1
                else
                  echo "Skipping non-resumable checkpoint ${ckpt_dir}; need model metadata plus DeepSpeed latest/global_step optimizer state."
                fi
              done < <(find "$OUTPUT_DIR" -maxdepth 1 -type d -name 'checkpoint-*' | sort -V)

              if [ "$found" -eq 0 ]; then
                echo "No strict-resume checkpoints ready for upload." >&2
                return 1
              fi
              echo "$stage_dir"
              return 0
            }

            upload_resume_checkpoints_once() {
              resume_stage_dir="$(stage_resume_checkpoints_for_upload || true)"
              if [ -n "$resume_stage_dir" ] && [ -d "$resume_stage_dir" ]; then
                osmo data upload "${RESUME_OUTPUT_S3_URI}/" "$resume_stage_dir"
                osmo data upload "${CACHE_RESUME_OUTPUT_S3_URI}/" "$resume_stage_dir"
              fi
            }

            stage_checkpoints_for_upload() {
              stage_root="/workspace/rf_checkpoint_upload"
              stage_dir="${stage_root}/${RUN_NAME}"
              rm -rf "$stage_dir"
              mkdir -p "$stage_dir"

              for top_file in wandb_config.json loss_log.jsonl; do
                if [ -f "${OUTPUT_DIR}/${top_file}" ]; then
                  cp -a "${OUTPUT_DIR}/${top_file}" "$stage_dir/"
                fi
              done
              if [ -d "${OUTPUT_DIR}/experiment_cfg" ]; then
                cp -a "${OUTPUT_DIR}/experiment_cfg" "$stage_dir/"
              fi

              found=0
              while IFS= read -r ckpt_dir; do
                [ -n "$ckpt_dir" ] || continue
                if is_complete_minimal_checkpoint "$ckpt_dir"; then
                  ckpt_name="$(basename "$ckpt_dir")"
                  copy_minimal_checkpoint "$ckpt_dir" "${stage_dir}/${ckpt_name}"
                  found=1
                else
                  echo "Skipping incomplete checkpoint ${ckpt_dir}; need model weights plus trainer_state.json and experiment_cfg/conf.yaml."
                fi
              done < <(find "$OUTPUT_DIR" -maxdepth 1 -type d -name 'checkpoint-*' | sort)

              if [ "$found" -eq 0 ]; then
                echo "No complete checkpoints ready for upload." >&2
                return 1
              fi
              echo "$stage_dir"
              return 0
            }

            upload_checkpoints_once() {
              upload_resume_checkpoints_once || true
              slim_checkpoints_once || true
              stage_dir="$(stage_checkpoints_for_upload || true)"
              if [ -n "$stage_dir" ] && [ -d "$stage_dir" ]; then
                osmo data upload "${OUTPUT_S3_URI}/" "$stage_dir"
                osmo data upload "${CACHE_OUTPUT_S3_URI}/" "$stage_dir"
              fi
            }

            checkpoint_slimmer_loop() {
              while true; do
                sleep "$CHECKPOINT_SLIM_INTERVAL_SECONDS" || break
                slim_checkpoints_once || true
              done
            }

            stop_checkpoint_slimmer() {
              if [ -n "${CHECKPOINT_SLIMMER_PID:-}" ] && kill -0 "$CHECKPOINT_SLIMMER_PID" 2>/dev/null; then
                echo "Stopping checkpoint slimmer pid=${CHECKPOINT_SLIMMER_PID}"
                kill "$CHECKPOINT_SLIMMER_PID" 2>/dev/null || true
                wait "$CHECKPOINT_SLIMMER_PID" 2>/dev/null || true
              fi
              unset CHECKPOINT_SLIMMER_PID
            }

            start_checkpoint_slimmer() {
              if is_truthy "$PRESERVE_LOCAL_DEEPSPEED_CHECKPOINTS"; then
                echo "Local checkpoint slimmer disabled; preserving DeepSpeed state for strict resume."
                return 0
              fi
              stop_checkpoint_slimmer
              checkpoint_slimmer_loop &
              CHECKPOINT_SLIMMER_PID=$!
              echo "Started checkpoint slimmer pid=${CHECKPOINT_SLIMMER_PID}, interval=${CHECKPOINT_SLIM_INTERVAL_SECONDS}, output_dir=${OUTPUT_DIR}"
            }

            periodic_checkpoint_upload() {
              while true; do
                sleep "$CHECKPOINT_UPLOAD_INTERVAL_SECONDS" || break
                echo "Periodic checkpoint upload tick: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
                osmo data upload "${BASE_LOG_S3_URI}/" /tmp/train_liftbarrier_gamma_droidwidth_teacher.log || true
                osmo data upload "${LOG_S3_URI}/" /tmp/train_liftbarrier_gamma_droidwidth_teacher.log || true
                upload_checkpoints_once || true
              done
            }

            stop_periodic_checkpoint_upload() {
              if [ -n "${PERIODIC_UPLOADER_PID:-}" ] && kill -0 "$PERIODIC_UPLOADER_PID" 2>/dev/null; then
                echo "Stopping periodic checkpoint uploader pid=${PERIODIC_UPLOADER_PID}"
                kill "$PERIODIC_UPLOADER_PID" 2>/dev/null || true
                wait "$PERIODIC_UPLOADER_PID" 2>/dev/null || true
              fi
              unset PERIODIC_UPLOADER_PID
            }

            start_periodic_checkpoint_upload() {
              stop_periodic_checkpoint_upload
              periodic_checkpoint_upload &
              PERIODIC_UPLOADER_PID=$!
              echo "Started periodic checkpoint uploader pid=${PERIODIC_UPLOADER_PID}, interval=${CHECKPOINT_UPLOAD_INTERVAL_SECONDS}, run=${RUN_NAME}, output_dir=${OUTPUT_DIR}"
            }

            is_complete_resume_checkpoint() {
              ckpt_dir="$1"
              [ -f "${ckpt_dir}/trainer_state.json" ] && \
                { [ -f "${ckpt_dir}/model.safetensors" ] || [ -f "${ckpt_dir}/model.safetensors.index.json" ]; }
            }

            restore_checkpoints_from_s3() {
              src_uri="$1"
              label="$2"
              if [ -z "$src_uri" ]; then
                return 1
              fi
              import_dir="/workspace/restore_import/${label}"
              rm -rf "$import_dir"
              mkdir -p "$import_dir"
              echo "Restoring candidate checkpoints from ${src_uri}/ into ${import_dir}"
              set +e
              osmo data download --resume "${src_uri}/" "$import_dir"
              restore_status=$?
              set -e
              if [ "$restore_status" -ne 0 ]; then
                echo "Checkpoint restore from ${src_uri}/ failed with status=${restore_status}."
                return 1
              fi
              found=0
              while IFS= read -r ckpt_dir; do
                [ -n "$ckpt_dir" ] || continue
                ckpt_name="$(basename "$ckpt_dir")"
                if is_complete_resume_checkpoint "$ckpt_dir"; then
                  echo "Promoting restored checkpoint ${ckpt_dir} -> ${OUTPUT_DIR}/${ckpt_name}"
                  mkdir -p "${OUTPUT_DIR}/${ckpt_name}"
                  cp -an "${ckpt_dir}/." "${OUTPUT_DIR}/${ckpt_name}/"
                  found=1
                else
                  echo "Skipping incomplete restored checkpoint ${ckpt_dir}; need model weights plus trainer_state.json."
                fi
              done < <(find "$import_dir" -type d -name 'checkpoint-*' | sort)
              if [ "$found" -eq 0 ]; then
                echo "No usable complete checkpoint-* directories found under ${src_uri}/."
                return 1
              fi
              return 0
            }

            latest_complete_checkpoint() {
              search_root="$1"
              latest=""
              while IFS= read -r ckpt_dir; do
                [ -n "$ckpt_dir" ] || continue
                if is_complete_resume_checkpoint "$ckpt_dir"; then
                  latest="$ckpt_dir"
                fi
              done < <(find "$search_root" -maxdepth 1 -type d -name 'checkpoint-*' | sort -V)
              if [ -n "$latest" ]; then
                printf '%s\n' "$latest"
                return 0
              fi
              return 1
            }

            configure_stage_paths() {
              stage_run_name="$1"
              RUN_NAME="$stage_run_name"
              RUN_S3_ROOT="s3://GearHome/users/xianzhef/oci-migration/dreamzero_runs/${RUN_NAME}"
              OUTPUT_S3_URI="${RUN_S3_ROOT}/checkpoints"
              LOG_S3_URI="${RUN_S3_ROOT}/logs"
              CACHE_OUTPUT_S3_URI="s3://GearHome/users/xianzhef/oci-migration/dreamzero_s3cache/bootstrap_checkpoints/${RUN_NAME}"
              RESUME_OUTPUT_S3_URI="${RUN_S3_ROOT}/resume_checkpoints"
              CACHE_RESUME_OUTPUT_S3_URI="s3://GearHome/users/xianzhef/oci-migration/dreamzero_s3cache/resume_checkpoints/${RUN_NAME}"
            }

            configure_stage_loss_weights() {
              stage_prefix="$1"
              case "$stage_prefix" in
                stage1)
                  export DYNAMICS_LOSS_WEIGHT="$STAGE1_DYNAMICS_LOSS_WEIGHT"
                  export ACTION_LOSS_WEIGHT="$STAGE1_ACTION_LOSS_WEIGHT"
                  export GRIPPER_ACTION_LOSS_WEIGHT="$STAGE1_GRIPPER_ACTION_LOSS_WEIGHT"
                  export GRIPPER_CLOSE_ACTION_LOSS_WEIGHT="$STAGE1_GRIPPER_CLOSE_ACTION_LOSS_WEIGHT"
                  export GRIPPER_CLEAN_ACTION_LOSS_WEIGHT="$STAGE1_GRIPPER_CLEAN_ACTION_LOSS_WEIGHT"
                  export GRIPPER_CLEAN_CLOSE_ACTION_LOSS_WEIGHT="$STAGE1_GRIPPER_CLEAN_CLOSE_ACTION_LOSS_WEIGHT"
                  export GRIPPER_BINARY_ACTION_LOSS_WEIGHT="$STAGE1_GRIPPER_BINARY_ACTION_LOSS_WEIGHT"
                  export GRIPPER_BINARY_CLOSE_ACTION_LOSS_WEIGHT="$STAGE1_GRIPPER_BINARY_CLOSE_ACTION_LOSS_WEIGHT"
                  export ACTION_PREFIX_LOSS_WEIGHT="$STAGE1_ACTION_PREFIX_LOSS_WEIGHT"
                  export ACTION_DELTA_LOSS_WEIGHT="$STAGE1_ACTION_DELTA_LOSS_WEIGHT"
                  export ACTION_JERK_LOSS_WEIGHT="$STAGE1_ACTION_JERK_LOSS_WEIGHT"
                  ;;
                stage2)
                  export DYNAMICS_LOSS_WEIGHT="$STAGE2_DYNAMICS_LOSS_WEIGHT"
                  export ACTION_LOSS_WEIGHT="$STAGE2_ACTION_LOSS_WEIGHT"
                  export GRIPPER_ACTION_LOSS_WEIGHT="$STAGE2_GRIPPER_ACTION_LOSS_WEIGHT"
                  export GRIPPER_CLOSE_ACTION_LOSS_WEIGHT="$STAGE2_GRIPPER_CLOSE_ACTION_LOSS_WEIGHT"
                  export GRIPPER_CLEAN_ACTION_LOSS_WEIGHT="$STAGE2_GRIPPER_CLEAN_ACTION_LOSS_WEIGHT"
                  export GRIPPER_CLEAN_CLOSE_ACTION_LOSS_WEIGHT="$STAGE2_GRIPPER_CLEAN_CLOSE_ACTION_LOSS_WEIGHT"
                  export GRIPPER_BINARY_ACTION_LOSS_WEIGHT="$STAGE2_GRIPPER_BINARY_ACTION_LOSS_WEIGHT"
                  export GRIPPER_BINARY_CLOSE_ACTION_LOSS_WEIGHT="$STAGE2_GRIPPER_BINARY_CLOSE_ACTION_LOSS_WEIGHT"
                  export ACTION_PREFIX_LOSS_WEIGHT="$STAGE2_ACTION_PREFIX_LOSS_WEIGHT"
                  export ACTION_DELTA_LOSS_WEIGHT="$STAGE2_ACTION_DELTA_LOSS_WEIGHT"
                  export ACTION_JERK_LOSS_WEIGHT="$STAGE2_ACTION_JERK_LOSS_WEIGHT"
                  ;;
                *)
                  echo "ERROR: unknown stage loss prefix ${stage_prefix}" >&2
                  exit 10
                  ;;
              esac
            }

            run_training_stage() {
              stage_label="$1"
              stage_run_name="$2"
              stage_max_steps="$3"
              sparse_hub="$4"
              stage_pretrained_dir="$5"
              stage_output_dir="$6"
              stage_loss_prefix="$7"

              configure_stage_paths "$stage_run_name"
              configure_stage_loss_weights "$stage_loss_prefix"
              export STAGE_LABEL="$stage_label"
              export MAX_STEPS="$stage_max_steps"
              export USE_SPARSE_HUB_ATTENTION="$sparse_hub"
              export PRETRAINED_DIR="$stage_pretrained_dir"
              export PRETRAINED_LORA_DIR="${STAGE1_PRETRAINED_LORA_DIR:-}"
              export OUTPUT_DIR="$stage_output_dir"
              export WANDB_RUN_NAME="$RUN_NAME"
              export WANDB_RUN_ID="$RUN_NAME"
              mkdir -p "$OUTPUT_DIR"

              if [ "$USE_SPARSE_HUB_ATTENTION" = "false" ] && \
                 [ "$GLOBAL_VIDEO_ATTENTION_MODE" != "bidirectional" ] && \
                 ! is_truthy "${ALLOW_NONBIDIRECTIONAL_TEACHER:-false}"; then
                echo "ERROR: droidwidth teacher requires GLOBAL_VIDEO_ATTENTION_MODE=bidirectional; got ${GLOBAL_VIDEO_ATTENTION_MODE}." >&2
                echo "Set ALLOW_NONBIDIRECTIONAL_TEACHER=true only for explicit ablations." >&2
                exit 66
              fi

              echo "Launching DreamZero RoboFactory LiftBarrier staged Gamma training: ${stage_label}"
              echo "BASE_RUN_NAME=$BASE_RUN_NAME"
              echo "STAGE_LABEL=$stage_label"
              echo "RUN_NAME=$RUN_NAME"
              echo "DATA_VARIANT=$DATA_VARIANT"
              echo "DATA_ROOT=$DATA_ROOT"
              echo "DATASET_SHARD_SAMPLING_RATE=$DATASET_SHARD_SAMPLING_RATE"
              echo "OUTPUT_DIR=$OUTPUT_DIR"
              echo "OUTPUT_S3_URI=$OUTPUT_S3_URI"
              echo "CACHE_OUTPUT_S3_URI=$CACHE_OUTPUT_S3_URI"
              echo "PRETRAINED_DIR=$PRETRAINED_DIR"
              echo "PRETRAINED_LORA_DIR=$PRETRAINED_LORA_DIR"
              echo "MAX_STEPS=$MAX_STEPS"
              echo "TRAIN_NUM_FRAMES=$TRAIN_NUM_FRAMES"
              echo "TRAIN_ACTION_HORIZON=$TRAIN_ACTION_HORIZON"
              echo "TRAIN_NUM_FRAME_PER_BLOCK=$TRAIN_NUM_FRAME_PER_BLOCK"
              echo "TRAIN_NUM_ACTION_PER_BLOCK=$TRAIN_NUM_ACTION_PER_BLOCK"
              echo "TRAIN_WARMUP_RATIO=$TRAIN_WARMUP_RATIO"
              echo "TRAIN_WEIGHT_DECAY=$TRAIN_WEIGHT_DECAY"
              echo "TRAIN_MAX_CHUNK_SIZE=$TRAIN_MAX_CHUNK_SIZE"
              echo "TRAIN_MAX_GRAD_NORM=${TRAIN_MAX_GRAD_NORM:-unset}"
              echo "MODEL_MAX_STATE_DIM=$MODEL_MAX_STATE_DIM"
              echo "MODEL_ACTION_DIM=$MODEL_ACTION_DIM"
              echo "AGENT_STATE_PAD_DIM=$AGENT_STATE_PAD_DIM"
              echo "AGENT_ACTION_PAD_DIM=$AGENT_ACTION_PAD_DIM"
              echo "GRIPPER_ACTION_DIMS=$GRIPPER_ACTION_DIMS"
              echo "DYNAMICS_LOSS_WEIGHT=$DYNAMICS_LOSS_WEIGHT"
              echo "ACTION_LOSS_WEIGHT=$ACTION_LOSS_WEIGHT"
              echo "GRIPPER_ACTION_LOSS_WEIGHT=$GRIPPER_ACTION_LOSS_WEIGHT"
              echo "GRIPPER_CLOSE_ACTION_LOSS_WEIGHT=$GRIPPER_CLOSE_ACTION_LOSS_WEIGHT"
              echo "GRIPPER_CLEAN_ACTION_LOSS_WEIGHT=$GRIPPER_CLEAN_ACTION_LOSS_WEIGHT"
              echo "GRIPPER_CLEAN_CLOSE_ACTION_LOSS_WEIGHT=$GRIPPER_CLEAN_CLOSE_ACTION_LOSS_WEIGHT"
              echo "GRIPPER_BINARY_ACTION_LOSS_WEIGHT=$GRIPPER_BINARY_ACTION_LOSS_WEIGHT"
              echo "GRIPPER_BINARY_CLOSE_ACTION_LOSS_WEIGHT=$GRIPPER_BINARY_CLOSE_ACTION_LOSS_WEIGHT"
              echo "GRIPPER_BINARY_LOGIT_SCALE=$GRIPPER_BINARY_LOGIT_SCALE"
              echo "GRIPPER_BINARY_MAX_SIGMA=$GRIPPER_BINARY_MAX_SIGMA"
              echo "ACTION_DELTA_LOSS_WEIGHT=$ACTION_DELTA_LOSS_WEIGHT"
              echo "ACTION_JERK_LOSS_WEIGHT=$ACTION_JERK_LOSS_WEIGHT"
              echo "ACTION_DELTA_MAX_SIGMA=$ACTION_DELTA_MAX_SIGMA"
              echo "ACTION_DELTA_EXCLUDE_GRIPPER=$ACTION_DELTA_EXCLUDE_GRIPPER"
              echo "FIRST_CLOSE_JOINT_LOSS_WEIGHT=$FIRST_CLOSE_JOINT_LOSS_WEIGHT"
              echo "FIRST_CLOSE_JOINT_LOSS_WINDOW_BEFORE=$FIRST_CLOSE_JOINT_LOSS_WINDOW_BEFORE"
              echo "FIRST_CLOSE_JOINT_LOSS_WINDOW_AFTER=$FIRST_CLOSE_JOINT_LOSS_WINDOW_AFTER"
              echo "ROPE_AGENT_DIM=$ROPE_AGENT_DIM"
              echo "MULTI_AGENT_SHUFFLE_AGENTS=$MULTI_AGENT_SHUFFLE_AGENTS"
              echo "MULTI_AGENT_SAMPLE_AGENT_POOL=$MULTI_AGENT_SAMPLE_AGENT_POOL"
              echo "GLOBAL_VIDEO_DROPOUT_PROB=$GLOBAL_VIDEO_DROPOUT_PROB"
              echo "GLOBAL_VIDEO_TIMESTEP_MODE=$GLOBAL_VIDEO_TIMESTEP_MODE"
              echo "GLOBAL_VIDEO_ATTENTION_MODE=$GLOBAL_VIDEO_ATTENTION_MODE"
              echo "ATTENTION_BACKEND=$ATTENTION_BACKEND"
              echo "USE_SPARSE_HUB_ATTENTION=$USE_SPARSE_HUB_ATTENTION"
              echo "Checkpoints available before ${stage_label}:"
              find "$OUTPUT_DIR" -maxdepth 1 -type d -name 'checkpoint-*' -print | sort -V || true

              start_checkpoint_slimmer
              start_periodic_checkpoint_upload
              set +e
              bash scripts/train/robofactory_bimanual_training.sh
              train_status=$?
              set -e
              stop_periodic_checkpoint_upload
              stop_checkpoint_slimmer
              slim_checkpoints_once || true
              osmo data upload "${LOG_S3_URI}/" /tmp/train_liftbarrier_gamma_droidwidth_teacher.log || true
              upload_checkpoints_once
              if [ "$train_status" -ne 0 ]; then
                exit "$train_status"
              fi
            }

            restore_stage1_lora_from_s3() {
              src_uri="$1"
              label="$2"
              if [ -z "$src_uri" ]; then
                return 1
              fi
              import_dir="/workspace/restore_lora/${label}"
              rm -rf "$import_dir"
              mkdir -p "$import_dir"
              echo "Restoring candidate LoRA warm-start checkpoints from ${src_uri}/ into ${import_dir}"
              set +e
              osmo data download --resume "${src_uri}/" "$import_dir"
              restore_status=$?
              set -e
              if [ "$restore_status" -ne 0 ]; then
                echo "LoRA warm-start restore from ${src_uri}/ failed with status=${restore_status}."
                return 1
              fi

              latest=""
              while IFS= read -r ckpt_dir; do
                [ -n "$ckpt_dir" ] || continue
                if is_complete_minimal_checkpoint "$ckpt_dir"; then
                  latest="$ckpt_dir"
                else
                  echo "Skipping incomplete LoRA warm-start checkpoint ${ckpt_dir}; need model weights, trainer_state.json, and experiment_cfg/conf.yaml."
                fi
              done < <(find "$import_dir" -type d -name 'checkpoint-*' | sort -V)

              if [ -z "$latest" ]; then
                echo "No usable LoRA warm-start checkpoint-* directories found under ${src_uri}/."
                return 1
              fi
              STAGE1_PRETRAINED_LORA_DIR="$latest"
              export STAGE1_PRETRAINED_LORA_DIR
              echo "Selected LoRA warm-start checkpoint: ${STAGE1_PRETRAINED_LORA_DIR}"
              return 0
            }

            restore_stage1_lora_checkpoint() {
              if [ -z "$RESTORE_RUN_NAME" ]; then
                echo "No restore run configured; droidwidth teacher will start from DreamZero-DROID."
                return 0
              fi

              echo "Attempting to restore droidwidth teacher LoRA warm-start from RESTORE_RUN_NAME=${RESTORE_RUN_NAME}"
              echo "Restored LoRA checkpoint will be loaded through PRETRAINED_LORA_DIR, not Trainer resume."
              if restore_stage1_lora_from_s3 "$RESTORE_CACHE_S3_URI" "restore_cache"; then
                echo "Restored droidwidth teacher LoRA warm-start from cache URI ${RESTORE_CACHE_S3_URI}."
                return 0
              fi
              if restore_stage1_lora_from_s3 "$RESTORE_S3_URI" "restore_primary"; then
                echo "Restored droidwidth teacher LoRA warm-start from primary URI ${RESTORE_S3_URI}."
                return 0
              fi
              echo "No previous droidwidth teacher LoRA warm-start restored; training will start from DreamZero-DROID."
            }

            restore_strict_resume_from_s3() {
              src_uri="$1"
              label="$2"
              dest_dir="$3"
              if [ -z "$src_uri" ]; then
                return 1
              fi
              import_dir="/workspace/strict_resume_import/${label}"
              rm -rf "$import_dir"
              mkdir -p "$import_dir"
              echo "Restoring strict DeepSpeed resume checkpoints from ${src_uri}/ into ${import_dir}"
              set +e
              osmo data download --resume "${src_uri}/" "$import_dir"
              restore_status=$?
              set -e
              if [ "$restore_status" -ne 0 ]; then
                echo "Strict resume restore from ${src_uri}/ failed with status=${restore_status}."
                return 1
              fi

              found=0
              mkdir -p "$dest_dir"
              while IFS= read -r ckpt_dir; do
                [ -n "$ckpt_dir" ] || continue
                ckpt_name="$(basename "$ckpt_dir")"
                if is_complete_strict_resume_checkpoint "$ckpt_dir"; then
                  echo "Promoting strict resume checkpoint ${ckpt_dir} -> ${dest_dir}/${ckpt_name}"
                  mkdir -p "${dest_dir}/${ckpt_name}"
                  cp -an "${ckpt_dir}/." "${dest_dir}/${ckpt_name}/"
                  found=1
                else
                  echo "Skipping non-strict restored checkpoint ${ckpt_dir}; need DeepSpeed latest/global_step optimizer state."
                fi
              done < <(find "$import_dir" -type d -name 'checkpoint-*' | sort -V)

              if [ "$found" -eq 0 ]; then
                echo "No usable strict-resume checkpoint-* directories found under ${src_uri}/."
                return 1
              fi
              return 0
            }

            restore_strict_resume_checkpoint() {
              if [ -z "$STRICT_RESUME_RUN_NAME" ]; then
                return 0
              fi

              echo "Attempting strict DeepSpeed resume from STRICT_RESUME_RUN_NAME=${STRICT_RESUME_RUN_NAME}"
              echo "Strict resume requires full DeepSpeed checkpoint state; slim eval checkpoints are intentionally rejected."
              if [ -n "$RESTORE_RUN_NAME" ]; then
                echo "RESTORE_RUN_NAME=${RESTORE_RUN_NAME} ignored because STRICT_RESUME_RUN_NAME is set."
              fi
              if restore_strict_resume_from_s3 "$STRICT_RESUME_CACHE_S3_URI" "strict_resume_cache" "$STAGE1_OUTPUT_DIR"; then
                echo "Restored strict resume checkpoint from cache URI ${STRICT_RESUME_CACHE_S3_URI}."
                return 0
              fi
              if restore_strict_resume_from_s3 "$STRICT_RESUME_S3_URI" "strict_resume_primary" "$STAGE1_OUTPUT_DIR"; then
                echo "Restored strict resume checkpoint from primary URI ${STRICT_RESUME_S3_URI}."
                return 0
              fi
              echo "ERROR: STRICT_RESUME_RUN_NAME was set, but no full DeepSpeed checkpoint could be restored." >&2
              exit 65
            }

            require_wandb

            DREAMZERO_DROID_PRETRAINED_DIR="$PRETRAINED_DIR"
            if [ -n "$STRICT_RESUME_RUN_NAME" ]; then
              restore_strict_resume_checkpoint
            else
              restore_stage1_lora_checkpoint
            fi
            run_training_stage \
              "droidwidth-teacher-style" \
              "$STAGE1_RUN_NAME" \
              "$STAGE1_MAX_STEPS" \
              "false" \
              "$DREAMZERO_DROID_PRETRAINED_DIR" \
              "$STAGE1_OUTPUT_DIR" \
              "stage1"

            TEACHER_CKPT="$(latest_complete_checkpoint "$STAGE1_OUTPUT_DIR" || true)"
            if [ -z "$TEACHER_CKPT" ]; then
              echo "ERROR: teacher did not produce a complete checkpoint." >&2
              exit 9
            fi
            echo "Teacher complete checkpoint selected: $TEACHER_CKPT"

            echo "Droidwidth Gamma teacher training complete."

