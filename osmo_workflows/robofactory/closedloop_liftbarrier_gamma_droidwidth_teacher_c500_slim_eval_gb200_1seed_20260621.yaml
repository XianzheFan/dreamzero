version: 2
workflow:
  groups:
  - name: eval-group
    tasks:
    - args:
      - /tmp/run_closedloop_gamma_droidwidth_teacher_c500_slim_eval_1seed_gb200.sh
      command:
      - bash
      credentials:
        gear-aws-cred:
          AWS_ACCESS_KEY_ID: aws_access_key_id
          AWS_DEFAULT_REGION: aws_default_region
          AWS_ENDPOINT_URL: aws_endpoint_url
          AWS_SECRET_ACCESS_KEY: aws_secret_access_key
        gear-data-credentials:
          GEAR_DATA_CREDENTIALS: data_credentials
      environment:
        ACCEPT_EULA: Y
        NO_NUCLEUS: Y
        NVIDIA_DRIVER_CAPABILITIES: all
      files:
      - contents: |-
          #!/usr/bin/env bash
          set -euo pipefail

          exec > >(tee /tmp/closedloop_gamma_droidwidth_teacher_c500_slim_eval_1seed_gb200.log) 2>&1

          RUN_NAME="dz-rf-sg-gamma-dwteacher-c500-slim-eval-gb200-1seed1000-xz-20260621"
          DREAMZERO_GIT_URL="https://github.com/XianzheFan/dreamzero.git"
          DREAMZERO_GIT_REF="${DREAMZERO_GIT_REF:-gamma}"
          ROBOFACTORY_GIT_URL="https://github.com/MARS-EAI/RoboFactory.git"
          ROBOFACTORY_GIT_COMMIT="5868242322414a91454e22f1dd9641f613ba1bcf"
          DATA_S3_URI="s3://GearHome/users/xianzhef/oci-migration/data/robofactory_lerobot_v2/LiftBarrier-rf-500"
          MODEL_CACHE_S3_URI="s3://GearHome/users/xianzhef/oci-migration/checkpoints"
          CKPT_S3_BASE="s3://GearHome/users/xianzhef/oci-migration/dreamzero_runs/dz-rf-sg-gamma-dwteacher-lb500-r4-actiondelta-xianzhef-20260621-teacher/checkpoints/dz-rf-sg-gamma-dwteacher-lb500-r4-actiondelta-xianzhef-20260621-teacher"
          CKPT_AMLFS_BASE="/mnt/amlfs-01/home/xianzhef/osmo_cache/dreamzero/checkpoints/dz-rf-sg-gamma-dwteacher-lb500-r4-actiondelta-xianzhef-20260621-teacher/dz-rf-sg-gamma-dwteacher-lb500-r4-actiondelta-xianzhef-20260621-teacher"
          CKPT_SETTING="checkpoint-500"
          CKPT_WAIT_TIMEOUT_SECONDS=5400
          CKPT_WAIT_INTERVAL_SECONDS=120
          LOCAL_EVAL_CKPT_ROOT="/workspace/eval_ckpts/gamma_droidwidth_teacher_c500_slim_eval_1seed1000"
          AMLFS_MODEL_CACHE_DIR="/mnt/amlfs-01/home/xianzhef/osmo_cache/dreamzero/checkpoints"
          DREAMZERO_VENV="/mnt/amlfs-01/home/xianzhef/osmo_cache/dreamzero/venvs/gb200_rf_eval_py312"
          MODEL_ONLY_DIAG="${MODEL_ONLY_DIAG:-1}"
          MODEL_ONLY_NUM_BATCHES="${MODEL_ONLY_NUM_BATCHES:-1}"
          MODEL_ONLY_INFERENCE_MODES="${MODEL_ONLY_INFERENCE_MODES:-causal_flowmatch noncausal_flowmatch}"
          ROBOFACTORY_ASSET_CACHE="/mnt/amlfs-01/home/xianzhef/osmo_cache/robofactory/assets"
          RUN_S3_ROOT="s3://GearHome/users/xianzhef/oci-migration/dreamzero_runs/${RUN_NAME}"
          DROID_HF_REPO="GEAR-Dreams/DreamZero-DROID"
          PORT=5011
          TASK="LiftBarrier-rf"
          NUM_EPISODES=1
          SEED_START=1000
          MAX_STEPS=300
          INFERENCE_MODES="${INFERENCE_MODES:-causal_flowmatch}"
          RESET_CAUSAL_STATE_EACH_INFERS="${RESET_CAUSAL_STATE_EACH_INFERS:-1}"
          VIDEO_PRED_ROLLOUT_MODE="${VIDEO_PRED_ROLLOUT_MODE:-noncausal}"
          VIDEO_PRED_WRIST_WINDOW_MODE="${VIDEO_PRED_WRIST_WINDOW_MODE:-action}"
          SHARED_GLOBAL_WRIST_WINDOW_MODE="${SHARED_GLOBAL_WRIST_WINDOW_MODE:-history-current-first}"
          export MAI_WRITE_DENOISED_CONTEXT_CACHE="${MAI_WRITE_DENOISED_CONTEXT_CACHE:-1}"
          export MAI_ROLLING_NOISE="${MAI_ROLLING_NOISE:-1}"
          REPLAN_EVERYS="24"
          PROMPT="the two robot arms lift the steel barrier together off the table"
          GRIPPER_BINARIZE_THRESHOLD="-0.2"
          GRIPPER_OVERRIDE="open-then-close-after-step"
          GRIPPER_POLICY_CLOSE_THRESHOLD="0.0"
          GRIPPER_POLICY_CLOSE_MIN_STEP=0
          GRIPPER_CLOSE_AFTER_STEP=52
          GRIPPER_CLOSE_PAIRS="52:52"
          JOINT_DELTA_SCALES="1.0 2.0"
          JOINT_DELTA_OUTPUT_CLIP="0.35"
          JOINT_DELTA_SCALE_REFERENCE="observed"
          JOINT_TARGET_SLEW_RATES="0.35"
          REPLAN_BOUNDARY_BLEND_STEPS="${REPLAN_BOUNDARY_BLEND_STEPS:-0 4}"
          TEMPORAL_ACTION_ENSEMBLE_DECAY="${TEMPORAL_ACTION_ENSEMBLE_DECAY:-0}"
          SERVER_CUDA_VISIBLE_DEVICES="1"
          CLIENT_CUDA_VISIBLE_DEVICES="0"
          SUCCESS_MODE="strict-lift"
          STRICT_SUCCESS_MIN_GRASP_COUNT=1
          RUN_OFFLINE=0
          export CKPT_SETTING LOCAL_EVAL_CKPT_ROOT

          case "$DREAMZERO_GIT_URL" in
            https://github.com/XianzheFan/dreamzero.git) ;;
            *) echo "Refusing non-xianzhef DreamZero repo: $DREAMZERO_GIT_URL" >&2; exit 64 ;;
          esac

          for uri in "$DATA_S3_URI" "$MODEL_CACHE_S3_URI" "$CKPT_S3_BASE" "$RUN_S3_ROOT"; do
            case "$uri" in
              s3://GearHome/users/xianzhef/*) ;;
              *) echo "Refusing non-xianzhef S3 URI: $uri" >&2; exit 64 ;;
            esac
          done

          for path in "$AMLFS_MODEL_CACHE_DIR" "$ROBOFACTORY_ASSET_CACHE" "$CKPT_AMLFS_BASE"; do
            case "$path" in
              /mnt/amlfs-01/home/xianzhef/*) ;;
              *) echo "Refusing non-xianzhef AMLFS path: $path" >&2; exit 64 ;;
            esac
          done

          cleanup() {
            if [ -n "${SERVER_PID:-}" ] && kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Stopping policy server pid=${SERVER_PID}"
              kill "$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" 2>/dev/null || true
            fi
          }

          upload_artifacts() {
            local status="${1:-$?}"
            set +e
            mkdir -p /workspace/eval_outputs
            cp -f /tmp/closedloop_gamma_droidwidth_teacher_c500_slim_eval_1seed_gb200.log /workspace/eval_outputs/closedloop_gamma_droidwidth_teacher_c500_slim_eval_1seed_gb200.log
            if [ -f /tmp/server.log ]; then cp -f /tmp/server.log /workspace/eval_outputs/server.log; fi
            if [ -f /tmp/client.log ]; then cp -f /tmp/client.log /workspace/eval_outputs/client.log; fi
            find /tmp -maxdepth 1 -type f \( -name "server_*.log" -o -name "client_*.log" \) -exec cp -f {} /workspace/eval_outputs/ \; || true
            echo "Uploading eval outputs to ${RUN_S3_ROOT}/"
            osmo data upload "${RUN_S3_ROOT}/" /workspace/eval_outputs
            exit "$status"
          }

          on_exit() {
            status=$?
            cleanup
            upload_artifacts "$status"
          }
          trap on_exit EXIT

          export PYTHONUNBUFFERED=1
          export HYDRA_FULL_ERROR=1
          export GIT_LFS_SKIP_SMUDGE=1
          export ATTENTION_BACKEND=flex
          export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
          export CUDA_MODULE_LOADING=LAZY
          export HF_HOME=/workspace/hf
          export HF_HUB_CACHE=/workspace/hf/hub
          export TRANSFORMERS_CACHE=/workspace/hf/transformers
          export HF_HUB_OFFLINE=0
          export TRANSFORMERS_OFFLINE=0
          export HF_DATASETS_OFFLINE=0
          export HF_HUB_DISABLE_XET=1
          export XDG_CACHE_HOME=/workspace/cache
          export CUDA_CACHE_PATH=/workspace/cuda_cache
          export NO_ALBUMENTATIONS_UPDATE=1
          export PIP_ROOT_USER_ACTION=ignore
          export MUJOCO_GL=glfw
          if [ -d /usr/lib/aarch64-linux-gnu ]; then
            export LD_LIBRARY_PATH="/usr/lib/aarch64-linux-gnu:${LD_LIBRARY_PATH:-}"
          elif [ -d /usr/lib/x86_64-linux-gnu ]; then
            export LD_LIBRARY_PATH="/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          fi

          mkdir -p \
            /workspace/code \
            /workspace/data/LiftBarrier-rf \
            /workspace/model_import/DreamZero-DROID \
            "$LOCAL_EVAL_CKPT_ROOT" \
            /workspace/eval_outputs/offline \
            /workspace/eval_outputs/action_dump \
            /workspace/eval_outputs/videos \
            /workspace/eval_outputs/video_pred \
            /workspace/hf \
            /workspace/cache \
            /workspace/cuda_cache \
            "$(dirname "$DREAMZERO_VENV")" \
            /tmp/nvidia-vulkan \
            /tmp/nvidia-egl

          cat >/tmp/nvidia-vulkan/nvidia_icd.json <<'EOF'
          {
            "file_format_version": "1.0.0",
            "ICD": {
              "library_path": "libGLX_nvidia.so.0",
              "api_version": "1.2.140"
            }
          }
          EOF
          cat >/tmp/nvidia-egl/10_nvidia.json <<'EOF'
          {
            "file_format_version": "1.0.0",
            "ICD": {
              "library_path": "libEGL_nvidia.so.0"
            }
          }
          EOF
          export VK_ICD_FILENAMES=/tmp/nvidia-vulkan/nvidia_icd.json
          export __EGL_VENDOR_LIBRARY_FILENAMES=/tmp/nvidia-egl/10_nvidia.json
          export __GLX_VENDOR_LIBRARY_NAME=nvidia

          echo "Installing Python packages for DreamZero + RoboFactory eval"
          if ! command -v uv >/dev/null 2>&1; then
            echo "FATAL: uv is required to create the GB200 Python 3.12 eval venv." >&2
            exit 65
          fi
          if [ ! -x /usr/bin/python3.12 ]; then
            echo "FATAL: /usr/bin/python3.12 is required for the GB200 eval venv." >&2
            exit 65
          fi
          if [ ! -x "${DREAMZERO_VENV}/bin/python" ]; then
            uv venv --python /usr/bin/python3.12 --system-site-packages "$DREAMZERO_VENV"
          fi
          export PATH="${DREAMZERO_VENV}/bin:${PATH}"
          python --version
          python -m pip install -q --upgrade "pip<25.3" "setuptools>=64,<80" wheel "huggingface_hub[cli]"
          if [ "$MODEL_ONLY_DIAG" = "1" ]; then
            DEPS_MARKER="${DREAMZERO_VENV}/.gb200_model_only_eval_deps_v2"
          else
            DEPS_MARKER="${DREAMZERO_VENV}/.gb200_robofactory_eval_deps_v1"
          fi
          if [ ! -f "$DEPS_MARKER" ]; then
            if [ "$MODEL_ONLY_DIAG" != "1" ]; then
              python -m pip install -q "mani_skill==3.0.0b12"
            fi
            python -m pip install -q \
              "websockets>=12" \
              msgpack \
              msgpack-numpy \
              hydra-core \
              omegaconf \
              safetensors \
              "einops==0.8.1" \
              "transformers==4.51.3" \
              "diffusers==0.30.2" \
              "peft==0.5.0" \
              accelerate \
              dm-tree \
              "albumentations==1.4.18" \
              torchvision \
              "av==15.0.0" \
              pillow \
              ftfy \
              sentencepiece \
              termcolor \
              tiktoken \
              timm \
              loguru \
              matplotlib \
              h5py \
              "opencv-python-headless==4.10.0.84" \
              pandas \
              pyarrow \
              "datasets==3.6.0" \
              imageio \
              imageio-ffmpeg
            python -m pip install -q "numpy==1.26.4"
            date -u +"%Y-%m-%dT%H:%M:%SZ" > "$DEPS_MARKER"
          else
            echo "GB200 eval dependency cache already present: ${DEPS_MARKER}"
          fi

          mkdir -p /workspace/checkpoints

          echo "Restoring Wan/UMT5 model caches"
          WAN_EXPECTED="/workspace/checkpoints/Wan2.1-I2V-14B-480P"
          WAN_AMLFS="${AMLFS_MODEL_CACHE_DIR}/Wan2.1-I2V-14B-480P"
          if [ -f "${WAN_AMLFS}/.cache_complete" ]; then
            echo "Using Wan2.1-I2V-14B-480P from AMLFS cache"
            ln -sfn "$WAN_AMLFS" "$WAN_EXPECTED"
          else
            echo "AMLFS Wan cache unavailable; restoring from xianzhef S3 model cache"
            WAN_IMPORT="/workspace/model_import/Wan2.1-I2V-14B-480P"
            mkdir -p "$WAN_IMPORT"
            wan_regex='.*(\.cache_complete|models_t5_umt5-xxl-enc-bf16\.pth|models_clip_open-clip-xlm-roberta-large-vit-huge-14\.pth|Wan2\.1_VAE\.pth)$'
            osmo data download --resume --regex "$wan_regex" --processes 1 --threads 1 "${MODEL_CACHE_S3_URI}/Wan2.1-I2V-14B-480P/" "$WAN_IMPORT"
            if [ -f "${WAN_IMPORT}/.cache_complete" ]; then
              ln -sfn "$WAN_IMPORT" "$WAN_EXPECTED"
            elif [ -f "${WAN_IMPORT}/Wan2.1-I2V-14B-480P/.cache_complete" ]; then
              ln -sfn "${WAN_IMPORT}/Wan2.1-I2V-14B-480P" "$WAN_EXPECTED"
            else
              echo "FATAL: no usable Wan2.1-I2V-14B-480P cache after S3 download" >&2
              find "$WAN_IMPORT" -maxdepth 3 -type f | sed -n "1,80p" || true
              exit 22
            fi
          fi
          test -f "${WAN_EXPECTED}/.cache_complete"
          test -f "${WAN_EXPECTED}/models_t5_umt5-xxl-enc-bf16.pth"
          test -f "${WAN_EXPECTED}/models_clip_open-clip-xlm-roberta-large-vit-huge-14.pth"
          test -f "${WAN_EXPECTED}/Wan2.1_VAE.pth"

          UMT5_EXPECTED="/workspace/checkpoints/umt5-xxl"
          UMT5_AMLFS="${AMLFS_MODEL_CACHE_DIR}/umt5-xxl"
          UMT5_AMLFS_NESTED="${UMT5_AMLFS}/umt5-xxl"
          if [ -f "${UMT5_AMLFS}/config.json" ] && [ -f "${UMT5_AMLFS}/tokenizer_config.json" ]; then
            echo "Using umt5-xxl from AMLFS cache"
            ln -sfn "$UMT5_AMLFS" "$UMT5_EXPECTED"
          elif [ -f "${UMT5_AMLFS_NESTED}/config.json" ] && [ -f "${UMT5_AMLFS_NESTED}/tokenizer_config.json" ]; then
            echo "Using umt5-xxl tokenizer from nested AMLFS cache"
            ln -sfn "$UMT5_AMLFS_NESTED" "$UMT5_EXPECTED"
          else
            echo "AMLFS umt5-xxl tokenizer cache unavailable; restoring tokenizer files from xianzhef S3 model cache"
            UMT5_IMPORT="/workspace/model_import/umt5-xxl"
            mkdir -p "$UMT5_IMPORT"
            umt5_regex='.*(config\.json|tokenizer_config\.json|special_tokens_map\.json|spiece\.model|tokenizer\.json)$'
            osmo data download --resume --regex "$umt5_regex" --processes 1 --threads 2 "${MODEL_CACHE_S3_URI}/umt5-xxl/" "$UMT5_IMPORT"
            if [ -f "${UMT5_IMPORT}/config.json" ]; then
              ln -sfn "$UMT5_IMPORT" "$UMT5_EXPECTED"
            elif [ -f "${UMT5_IMPORT}/umt5-xxl/config.json" ]; then
              ln -sfn "${UMT5_IMPORT}/umt5-xxl" "$UMT5_EXPECTED"
            else
              echo "FATAL: no usable umt5-xxl cache after S3 download" >&2
              find "$UMT5_IMPORT" -maxdepth 3 -type f | sed -n "1,80p" || true
              exit 21
            fi
          fi
          test -f "${UMT5_EXPECTED}/config.json"
          test -f "${UMT5_EXPECTED}/tokenizer_config.json"

          echo "Restoring DreamZero-DROID model to /workspace/checkpoints/DreamZero-DROID"
          DROID_EXPECTED="/workspace/checkpoints/DreamZero-DROID"
          DROID_IMPORT="/workspace/model_import/DreamZero-DROID"
          DROID_AMLFS="${AMLFS_MODEL_CACHE_DIR}/DreamZero-DROID"
          DROID_AMLFS_NESTED="${DROID_AMLFS}/DreamZero-DROID"
          rm -rf "$DROID_EXPECTED"
          if [ -f "${DROID_AMLFS}/model.safetensors.index.json" ]; then
            ln -sfn "$DROID_AMLFS" "$DROID_EXPECTED"
            echo "Using DreamZero-DROID from AMLFS root cache"
          elif [ -f "${DROID_AMLFS_NESTED}/model.safetensors.index.json" ]; then
            ln -sfn "$DROID_AMLFS_NESTED" "$DROID_EXPECTED"
            echo "Using DreamZero-DROID from nested AMLFS cache"
          else
            set +e
            osmo data download --resume --processes 1 --threads 4 "${MODEL_CACHE_S3_URI}/DreamZero-DROID/" "$DROID_IMPORT"
            droid_s3_status=$?
            set -e
            if [ "$droid_s3_status" -eq 0 ] && [ -f "${DROID_IMPORT}/model.safetensors.index.json" ]; then
            ln -sfn "$DROID_IMPORT" "$DROID_EXPECTED"
            echo "Using DreamZero-DROID from xianzhef S3 model cache root"
            elif [ "$droid_s3_status" -eq 0 ] && [ -f "${DROID_IMPORT}/DreamZero-DROID/model.safetensors.index.json" ]; then
            ln -sfn "${DROID_IMPORT}/DreamZero-DROID" "$DROID_EXPECTED"
            echo "Using DreamZero-DROID from xianzhef S3 model cache nested directory"
            else
            echo "No usable xianzhef S3 DreamZero-DROID cache found; downloading from Hugging Face"
            mkdir -p "$DROID_EXPECTED"
            if command -v hf >/dev/null 2>&1; then
              timeout 3600 hf download "$DROID_HF_REPO" --repo-type model --local-dir "$DROID_EXPECTED"
            elif command -v huggingface-cli >/dev/null 2>&1; then
              timeout 3600 huggingface-cli download "$DROID_HF_REPO" --repo-type model --local-dir "$DROID_EXPECTED"
            else
              timeout 3600 python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="GEAR-Dreams/DreamZero-DROID",
              repo_type="model",
              local_dir="/workspace/checkpoints/DreamZero-DROID",
              local_dir_use_symlinks=False,
          )
          PY
            fi
          fi
          fi
          test -f "${DROID_EXPECTED}/model.safetensors.index.json"
          du -sh "${DROID_EXPECTED}"

          echo "Cloning DreamZero ref ${DREAMZERO_GIT_REF}"
          git clone --no-checkout --filter=blob:none "$DREAMZERO_GIT_URL" /workspace/code/dreamzero
          git -C /workspace/code/dreamzero fetch --depth 1 origin "$DREAMZERO_GIT_REF"
          DREAMZERO_GIT_COMMIT="$(git -C /workspace/code/dreamzero rev-parse FETCH_HEAD)"
          git -C /workspace/code/dreamzero checkout --detach "$DREAMZERO_GIT_COMMIT"
          test "$(git -C /workspace/code/dreamzero rev-parse HEAD)" = "$DREAMZERO_GIT_COMMIT"
          echo "Resolved DreamZero ref ${DREAMZERO_GIT_REF} to ${DREAMZERO_GIT_COMMIT}"
          echo "$DREAMZERO_GIT_COMMIT" > /workspace/eval_outputs/dreamzero_code_commit.txt
            python -m py_compile \
            /workspace/code/dreamzero/eval_utils/bimanual_policy_server.py \
            /workspace/code/dreamzero/eval_utils/offline_video_action_diagnostic.py \
            /workspace/code/dreamzero/scripts/eval/eval_robofactory_ws.py \
            /workspace/code/dreamzero/scripts/eval/analyze_gripper_dump.py \
            /workspace/code/dreamzero/scripts/eval/analyze_video_pred_quality.py

          echo "Installing local DreamZero package"
          python -m pip install -q --no-cache-dir --ignore-requires-python -e /workspace/code/dreamzero --no-deps
          export PYTHONPATH="/workspace/code/dreamzero:${PYTHONPATH:-}"
          if [ "$MODEL_ONLY_DIAG" = "1" ]; then
            python - <<'PY'
          import importlib.util
          required = ["torch", "groot", "datasets", "websockets", "msgpack_numpy", "pyarrow", "av", "cv2"]
          for name in required:
              print(f"{name}: {bool(importlib.util.find_spec(name))}", flush=True)
          missing = [name for name in required if importlib.util.find_spec(name) is None]
          if missing:
              raise SystemExit(f"missing required model-only imports: {missing}")
          PY
          else
            echo "Cloning RoboFactory at ${ROBOFACTORY_GIT_COMMIT}"
            git clone --no-checkout --filter=blob:none "$ROBOFACTORY_GIT_URL" /workspace/code/RoboFactory
            git -C /workspace/code/RoboFactory fetch --depth 1 origin "$ROBOFACTORY_GIT_COMMIT"
            git -C /workspace/code/RoboFactory checkout --detach "$ROBOFACTORY_GIT_COMMIT"
            test "$(git -C /workspace/code/RoboFactory rev-parse HEAD)" = "$ROBOFACTORY_GIT_COMMIT"
            echo "Installing local RoboFactory package"
            python -m pip install -q --no-cache-dir -e /workspace/code/RoboFactory --no-deps
            python - <<'PY'
          import importlib.util
          required = ["torch", "groot", "robofactory", "mani_skill", "sapien", "gymnasium", "websockets", "msgpack_numpy", "pyarrow"]
          for name in required:
              print(f"{name}: {bool(importlib.util.find_spec(name))}", flush=True)
          missing = [name for name in required if importlib.util.find_spec(name) is None]
          if missing:
              raise SystemExit(f"missing required imports: {missing}")
          PY
          fi

          echo "Downloading RoboFactory LiftBarrier-rf-500 data"
          osmo data download --resume "${DATA_S3_URI}/" /workspace/data/LiftBarrier-rf
          if [ -d /workspace/data/LiftBarrier-rf/meta ]; then
            EVAL_DATA_ROOT=/workspace/data/LiftBarrier-rf
          elif [ -d /workspace/data/LiftBarrier-rf/LiftBarrier-rf-500/meta ]; then
            EVAL_DATA_ROOT=/workspace/data/LiftBarrier-rf/LiftBarrier-rf-500
          else
            echo "FATAL: could not locate downloaded LeRobot meta directory" >&2
            find /workspace/data/LiftBarrier-rf -maxdepth 3 -type d -name meta -print || true
            exit 1
          fi
          echo "EVAL_DATA_ROOT=${EVAL_DATA_ROOT}"
          mkdir -p /workspace/data/robofactory_lerobot_v2 /workspace/data/LiftBarrier-rf-500
          ln -sfn "$EVAL_DATA_ROOT" /workspace/data/robofactory_lerobot_v2/LiftBarrier-rf-500
          ln -sfn "$EVAL_DATA_ROOT" /workspace/data/LiftBarrier-rf-500/LiftBarrier-rf-500
          export ROBOFACTORY_DATA_ROOT_FOR_TRANSFORM=/workspace/data/robofactory_lerobot_v2/LiftBarrier-rf-500

          echo "Downloading checkpoint ${CKPT_SETTING}"
          candidate_dir="${LOCAL_EVAL_CKPT_ROOT}/${CKPT_SETTING}"
          amlfs_candidate="${CKPT_AMLFS_BASE}/${CKPT_SETTING}"
          mkdir -p "$LOCAL_EVAL_CKPT_ROOT"
          wait_for_checkpoint() {
            local candidate_uri="${CKPT_S3_BASE}/${CKPT_SETTING}/"
            local deadline=$((SECONDS + CKPT_WAIT_TIMEOUT_SECONDS))
            while true; do
              if [ -f "${amlfs_candidate}/model.safetensors" ] && \
                 [ -f "${amlfs_candidate}/trainer_state.json" ] && \
                 [ -f "${amlfs_candidate}/experiment_cfg/conf.yaml" ]; then
                echo "Checkpoint visible in AMLFS cache: ${amlfs_candidate}"
                return 0
              fi
              set +e
              osmo data list --no-pager "$candidate_uri" >/tmp/checkpoint_list.out 2>/tmp/checkpoint_list.err
              local list_status=$?
              grep -qE '(model\.safetensors|model\.safetensors\.index\.json)' /tmp/checkpoint_list.out
              local grep_status=$?
              set -e
              local status=1
              if [ "$list_status" -eq 0 ]; then
                status="$grep_status"
              fi
              if [ "$status" -eq 0 ]; then
                echo "Checkpoint visible in S3: ${candidate_uri}"
                return 0
              fi
