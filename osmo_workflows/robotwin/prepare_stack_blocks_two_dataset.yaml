workflow:
  timeout:
    queue_timeout: 2h
    exec_timeout: 3d
  name: "{{workflow_name}}"
  resources:
    default:
      cpu: 15
      gpu: 1
      memory: 120Gi
      storage: 750Gi
      nodesExcluded:
        - osmogroot-dgxc-k8s-forge-az05-prd1-w-8183
  tasks:
    - name: prepare-stack-blocks-two
      image: nvcr.io/nvidian/gr00t_isaac:v1.5
      credentials:
        gear-aws-cred:
          AWS_ACCESS_KEY_ID: aws_access_key_id
          AWS_SECRET_ACCESS_KEY: aws_secret_access_key
          AWS_DEFAULT_REGION: aws_default_region
          AWS_ENDPOINT_URL: aws_endpoint_url
        gear-data-credentials:
          GEAR_DATA_CREDENTIALS: data_credentials
      command: ["bash"]
      environment:
        ACCEPT_EULA: "Y"
        NO_NUCLEUS: "Y"
        NVIDIA_DRIVER_CAPABILITIES: "all"
      args: ["/tmp/prepare_stack_blocks_two.sh"]
      files:
        - path: /tmp/prepare_stack_blocks_two.sh
          contents: |
            #!/usr/bin/env bash
            set -euo pipefail

            exec > >(tee /tmp/prepare_stack_blocks_two.log) 2>&1

            RUN_NAME="{{workflow_name}}"
            CODE_S3_URI="{{code_s3_uri}}"
            ROBOTWIN_S3_URI="s3://GearHome/users/xianzhef/oci-migration/RoboTwin"
            ROBOTWIN_ENV_S3_URI="s3://GearHome/users/xianzhef/oci-migration/miniconda3/envs/RoboTwin"
            DATA_VARIANT="{{data_variant}}"
            ROBOTWIN_TARGET_EPISODES="${ROBOTWIN_TARGET_EPISODES:-{{target_episodes}}}"
            ROBOTWIN_NUM_EPISODES="${ROBOTWIN_NUM_EPISODES:-${ROBOTWIN_TARGET_EPISODES}}"
            ROBOTWIN_EXPECTED_EPISODES="${ROBOTWIN_EXPECTED_EPISODES:-${ROBOTWIN_TARGET_EPISODES}}"
            ROBOTWIN_COLLECT_EXTRA_SEEDS="${ROBOTWIN_COLLECT_EXTRA_SEEDS:-50}"
            ROBOTWIN_MAX_COLLECT_ATTEMPTS="${ROBOTWIN_MAX_COLLECT_ATTEMPTS:-80}"
            export ROBOTWIN_TARGET_EPISODES ROBOTWIN_NUM_EPISODES ROBOTWIN_EXPECTED_EPISODES ROBOTWIN_COLLECT_EXTRA_SEEDS ROBOTWIN_MAX_COLLECT_ATTEMPTS
            RAW_DATA_S3_URI="{{raw_data_s3_uri}}"
            RAW_BOOTSTRAP_DATA_S3_URI="{{raw_bootstrap_data_s3_uri}}"
            CONVERTED_DATA_S3_URI="{{converted_data_s3_uri}}"
            LOG_S3_URI="s3://GearHome/users/xianzhef/oci-migration/dreamzero_runs/${RUN_NAME}/logs"
            OSMO_CACHE_ROOT="${OSMO_CACHE_ROOT:-/mnt/amlfs-04/home/xianzhef/osmo_cache}"
            ROBOTWIN_ENV_DIR="${ROBOTWIN_ENV_DIR:-${OSMO_CACHE_ROOT}/robotwin_env}"
            ROBOTWIN_REPO_CACHE="${ROBOTWIN_REPO_CACHE:-${OSMO_CACHE_ROOT}/RoboTwin_${DATA_VARIANT}}"

            for uri in "$CODE_S3_URI" "$ROBOTWIN_S3_URI" "$ROBOTWIN_ENV_S3_URI" "$RAW_DATA_S3_URI" "$RAW_BOOTSTRAP_DATA_S3_URI" "$CONVERTED_DATA_S3_URI" "$LOG_S3_URI"; do
              if [ -z "$uri" ]; then
                continue
              fi
              case "$uri" in
                s3://GearHome/users/xianzhef/*) ;;
                swift://pdx.s8k.io/AUTH_team-gear/datasets/users/xianzhef/*) ;;
                *)
                  echo "Refusing non-xianzhef data URI: $uri" >&2
                  exit 64
                  ;;
              esac
            done

            upload_logs() {
              status=$?
              set +e
              echo "Dataset workflow exit status: $status"
              osmo data upload "${LOG_S3_URI}/" /tmp/prepare_stack_blocks_two.log
              exit "$status"
            }
            trap upload_logs EXIT

            export PYTHONUNBUFFERED=1
            export CUDA_VISIBLE_DEVICES=0
            export MUJOCO_GL=egl
            export GIT_LFS_SKIP_SMUDGE=1

            mkdir -p \
              /workspace/code/dreamzero \
              /workspace/deps \
              "/workspace/data/robotwin_lerobot_v2/${DATA_VARIANT}"

            setup_persistent_robotwin_cache() {
              mkdir -p "$OSMO_CACHE_ROOT" "$ROBOTWIN_ENV_DIR" "$ROBOTWIN_REPO_CACHE"
              if [ ! -e /workspace/robotwin ]; then
                ln -s "$ROBOTWIN_REPO_CACHE" /workspace/robotwin
              elif [ -d /workspace/robotwin ] && [ ! -L /workspace/robotwin ] && [ -z "$(find /workspace/robotwin -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
                rmdir /workspace/robotwin
                ln -s "$ROBOTWIN_REPO_CACHE" /workspace/robotwin
              fi
              echo "Using persistent OSMO cache root: $OSMO_CACHE_ROOT"
              df -h "$OSMO_CACHE_ROOT" || true
              echo "RoboTwin env cache: $ROBOTWIN_ENV_DIR"
              echo "RoboTwin repo/assets cache: $ROBOTWIN_REPO_CACHE"
              echo "RoboTwin workspace path: $(readlink -f /workspace/robotwin 2>/dev/null || echo /workspace/robotwin)"
            }

            setup_persistent_robotwin_cache

            count_hdf5_episodes() {
              if [ ! -d "$1" ]; then
                echo 0
                return
              fi
              find "$1" -maxdepth 1 -name 'episode*.hdf5' -print 2>/dev/null | wc -l | tr -d ' '
            }

            has_expected_hdf5_episodes() {
              episode_count="$(count_hdf5_episodes "$1")"
              expected_count="${ROBOTWIN_EXPECTED_EPISODES:-100}"
              echo "Found ${episode_count}/${expected_count} hdf5 episodes under $1"
              [ "$episode_count" -ge "$expected_count" ]
            }

            normalize_robotwin_raw_layout() {
              root="$1"
              nested="${root}/demo_full_franka"
              if [ ! -d "$nested" ]; then
                return
              fi
              if [ ! -d "${nested}/data" ] && [ ! -d "${nested}/video" ]; then
                return
              fi
              if [ -d "${root}/data" ] && [ -n "$(find "${root}/data" -maxdepth 1 -name 'episode*.hdf5' -print -quit 2>/dev/null)" ]; then
                echo "Nested RoboTwin raw data found at ${nested}, but direct data already has episodes; leaving nested copy untouched."
                return
              fi

              echo "Flattening nested RoboTwin raw data from ${nested} into ${root}."
              for name in data video instructions _traj_data scene_info.json seed.txt; do
                if [ -e "${nested}/${name}" ] && [ ! -e "${root}/${name}" ]; then
                  mv "${nested}/${name}" "${root}/${name}"
                elif [ -e "${nested}/${name}" ] && [ -d "${root}/${name}" ] && [ -d "${nested}/${name}" ] && [ -z "$(find "${root}/${name}" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
                  rmdir "${root}/${name}"
                  mv "${nested}/${name}" "${root}/${name}"
                elif [ -e "${nested}/${name}" ]; then
                  echo "Keeping existing ${root}/${name}; nested ${nested}/${name} remains."
                fi
              done
              rmdir "$nested" 2>/dev/null || true
            }

            last_hdf5_episode_idx() {
              "$ROBOTWIN_PYTHON" - "$1" <<'PY'
            import re
            import sys
            from pathlib import Path

            episode_dir = Path(sys.argv[1])
            max_idx = -1
            if episode_dir.is_dir():
                for path in episode_dir.glob("episode*.hdf5"):
                    match = re.fullmatch(r"episode(\d+)\.hdf5", path.name)
                    if match:
                        max_idx = max(max_idx, int(match.group(1)))
            print(max_idx)
            PY
            }

            parse_collect_error_episode() {
              "$ROBOTWIN_PYTHON" - "$1" <<'PY'
            import re
            import sys
            from pathlib import Path

            text = Path(sys.argv[1]).read_text(errors="ignore")
            matches = re.findall(r"saving:\s*episode\s*=\s*(\d+)", text)
            print(matches[-1] if matches else "")
            PY
            }

            repair_robotwin_failed_episode() {
              failed_idx="$1"
              echo "Cleaning RoboTwin failed/partial episode ${failed_idx} before retry."
              "$ROBOTWIN_PYTHON" - "$RAW_DATA_ROOT" "$failed_idx" <<'PY'
            import json
            import shutil
            import sys
            from pathlib import Path

            root = Path(sys.argv[1])
            failed_idx = int(sys.argv[2])
            if failed_idx < 0:
                raise SystemExit("cannot repair negative episode index")

            seed_path = root / "seed.txt"
            if seed_path.is_file():
                seeds = [int(item) for item in seed_path.read_text().split()]
                if failed_idx < len(seeds):
                    final_idx = len(seeds) - 1
                    if final_idx >= 0:
                        seeds[failed_idx] = seeds[final_idx]
                        seeds.pop()
                        seed_path.write_text(" ".join(str(seed) for seed in seeds))
                        for traj_dir in (root / "_traj_data", root / "data"):
                            failed_pkl = traj_dir / f"episode{failed_idx}.pkl"
                            final_pkl = traj_dir / f"episode{final_idx}.pkl"
                            if failed_pkl.exists():
                                failed_pkl.unlink()
                            if final_idx != failed_idx and final_pkl.exists():
                                failed_pkl.parent.mkdir(parents=True, exist_ok=True)
                                shutil.move(str(final_pkl), str(failed_pkl))
                        print(
                            f"Repaired seed/trajectory index {failed_idx} "
                            f"with previous final index {final_idx}."
                        )

            for path in (
                root / "data" / f"episode{failed_idx}.hdf5",
                root / "data" / f"episode{failed_idx}.pkl",
                root / "video" / f"episode{failed_idx}.mp4",
            ):
                if path.exists():
                    path.unlink()
                    print(f"Removed partial artifact: {path}")

            cache_dir = root / ".cache" / f"episode{failed_idx}"
            if cache_dir.exists():
                shutil.rmtree(cache_dir)
                print(f"Removed partial cache: {cache_dir}")

            scene_info = root / "scene_info.json"
            if scene_info.is_file():
                try:
                    db = json.loads(scene_info.read_text())
                except json.JSONDecodeError:
                    db = None
                if isinstance(db, dict) and db.pop(f"episode_{failed_idx}", None) is not None:
                    scene_info.write_text(json.dumps(db, ensure_ascii=False, indent=4))
                    print(f"Removed scene_info entry episode_{failed_idx}.")
            PY
            }

            patch_robotwin_collect_data_skip_failed_replays() {
              "$ROBOTWIN_PYTHON" - <<'PY'
            import re
            import textwrap
            from pathlib import Path

            p = Path("script/collect_data.py")
            s = p.read_text()
            marker = "RoboTwin OSMO skip failed replay episode"
            if marker not in s:
                match = re.search(r'^(?P<indent>[ \t]*)assert TASK_ENV\.check_success\(\), "Collect Error"\n', s, re.MULTILINE)
                if match is None:
                    raise SystemExit("did not find collect_data.py replay success assert")
                block = textwrap.dedent('''\
                    if not TASK_ENV.check_success():
                        print(f"RoboTwin OSMO skip failed replay episode {episode_idx}: Collect Error")
                        for rel_path in (
                            os.path.join("data", f"episode{episode_idx}.hdf5"),
                            os.path.join("video", f"episode{episode_idx}.mp4"),
                            os.path.join("_traj_data", f"episode{episode_idx}.pkl"),
                            os.path.join("data", f"episode{episode_idx}.pkl"),
                        ):
                            abs_path = os.path.join(args["save_path"], rel_path)
                            if os.path.exists(abs_path):
                                os.remove(abs_path)
                                print(f"Removed failed replay artifact: {abs_path}")
                        info_file_path = os.path.join(args["save_path"], "scene_info.json")
                        if os.path.exists(info_file_path):
                            with open(info_file_path, "r", encoding="utf-8") as file:
                                info_db = json.load(file)
                            if info_db.pop(f"episode_{episode_idx}", None) is not None:
                                with open(info_file_path, "w", encoding="utf-8") as file:
                                    json.dump(info_db, file, ensure_ascii=False, indent=4)
                        continue
                ''')
                replacement = textwrap.indent(block, match.group("indent"))
                s = s[:match.start()] + replacement + s[match.end():]
                compile(s, str(p), "exec")
                p.write_text(s)
                print("Patched RoboTwin collect_data.py to skip failed replay episodes.")
            else:
                print("RoboTwin collect_data.py failed replay skip patch already present.")
            PY
            }

            drop_last_partial_episode_if_needed() {
              episode_count="$(count_hdf5_episodes "$RAW_EPISODE_DIR")"
              expected_count="${ROBOTWIN_EXPECTED_EPISODES:-100}"
              if [ "$episode_count" -gt 0 ] && [ "$episode_count" -lt "$expected_count" ]; then
                last_idx="$(last_hdf5_episode_idx "$RAW_EPISODE_DIR")"
                if [ -n "$last_idx" ] && [ "$last_idx" -ge 0 ]; then
                  echo "Partial raw dataset has ${episode_count}/${expected_count} episodes; dropping tail episode ${last_idx} before resume."
                  repair_robotwin_failed_episode "$last_idx"
                fi
              fi
            }

            collect_robotwin_until_expected() {
              attempt=1
              while ! has_expected_hdf5_episodes "$RAW_EPISODE_DIR"; do
                if [ "$attempt" -gt "$ROBOTWIN_MAX_COLLECT_ATTEMPTS" ]; then
                  echo "ERROR: exceeded ROBOTWIN_MAX_COLLECT_ATTEMPTS=${ROBOTWIN_MAX_COLLECT_ATTEMPTS} while collecting RoboTwin data." >&2
                  return 13
                fi

                echo "RoboTwin collection attempt ${attempt}/${ROBOTWIN_MAX_COLLECT_ATTEMPTS}."
                collect_log="/tmp/robotwin_collect_attempt_${attempt}.log"
                set +e
                "$ROBOTWIN_PYTHON" script/collect_data.py stack_blocks_two "${TASK_CONFIG_NAME}" 2>&1 | tee "$collect_log"
                collect_status=${PIPESTATUS[0]}
                set -e

                if [ "$collect_status" -eq 0 ]; then
                  if has_expected_hdf5_episodes "$RAW_EPISODE_DIR"; then
                    return 0
                  fi
                  echo "RoboTwin collect_data.py exited 0 but expected episode count is still missing; continuing."
                  attempt=$((attempt + 1))
                  continue
                fi

                failed_episode="$(parse_collect_error_episode "$collect_log" || true)"
                if [ -z "$failed_episode" ]; then
                  failed_episode="$(last_hdf5_episode_idx "$RAW_EPISODE_DIR" || true)"
                fi
                if [ -z "$failed_episode" ] || [ "$failed_episode" -lt 0 ]; then
                  echo "ERROR: collect_data.py failed with status ${collect_status}, but no failed episode index could be inferred." >&2
                  return "$collect_status"
                fi

                echo "RoboTwin collect_data.py failed with status ${collect_status}; repairing episode ${failed_episode} and retrying."
                repair_robotwin_failed_episode "$failed_episode"
                attempt=$((attempt + 1))
              done
            }

            has_lerobot_meta() {
              [ -d "$1/meta" ] && [ -f "$1/meta/info.json" ] && [ -f "$1/meta/modality.json" ]
            }

            count_lerobot_episodes() {
              if [ ! -f "$1/meta/episodes.jsonl" ]; then
                echo 0
                return
              fi
              wc -l < "$1/meta/episodes.jsonl" | tr -d ' '
            }

            has_expected_lerobot_episodes() {
              if ! has_lerobot_meta "$1"; then
                return 1
              fi
              episode_count="$(count_lerobot_episodes "$1")"
              expected_count="${ROBOTWIN_NUM_EPISODES:-${ROBOTWIN_EXPECTED_EPISODES:-100}}"
              echo "Found ${episode_count}/${expected_count} converted LeRobot episodes under $1"
              [ "$episode_count" -ge "$expected_count" ]
            }

            install_converter_deps() {
              python - <<'PY'
            import importlib.util
            import subprocess
            import sys

            packages = {
                "av": "av",
                "cv2": "opencv-python-headless",
                "h5py": "h5py",
                "numpy": "numpy",
                "pandas": "pandas",
                "pyarrow": "pyarrow",
                "tqdm": "tqdm",
            }
            missing = [pkg for mod, pkg in packages.items() if importlib.util.find_spec(mod) is None]
            if missing:
                subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", *missing])
            PY
            }

            configure_nvidia_graphics() {
              mkdir -p /tmp/nvidia-vulkan /tmp/nvidia-egl
              cat >/tmp/nvidia-vulkan/nvidia_icd.json <<'EOF'
            {
              "file_format_version": "1.0.0",
              "ICD": {
                "library_path": "libGLX_nvidia.so.0",
                "api_version": "1.2.140"
              }
            }
            EOF
              cat >/tmp/nvidia-egl/10_nvidia.json <<'EOF'
            {
              "file_format_version": "1.0.0",
              "ICD": {
                "library_path": "libEGL_nvidia.so.0"
              }
            }
            EOF
              export VK_ICD_FILENAMES=/tmp/nvidia-vulkan/nvidia_icd.json
              export __EGL_VENDOR_LIBRARY_FILENAMES=/tmp/nvidia-egl/10_nvidia.json
              export __GLX_VENDOR_LIBRARY_NAME=nvidia
            }

            ensure_ffmpeg() {
              if command -v ffmpeg >/dev/null 2>&1; then
                ffmpeg -version | head -1
                return
              fi
              echo "Installing ffmpeg for RoboTwin HDF5/video merge."
              (
                unset PYTHONHOME PYTHONPATH
                export DEBIAN_FRONTEND=noninteractive
                apt-get update
                apt-get install -y --no-install-recommends ffmpeg
              )
              ffmpeg -version | head -1
            }

            prepare_robotwin_runtime() {
              ROBOTWIN_PYTHON="${ROBOTWIN_ENV_DIR}/bin/python3.10"
              if [ ! -e "$ROBOTWIN_PYTHON" ]; then
                ROBOTWIN_PYTHON="${ROBOTWIN_ENV_DIR}/bin/python"
              fi
              if [ ! -e "$ROBOTWIN_PYTHON" ]; then
                echo "Downloading RoboTwin conda env from ${ROBOTWIN_ENV_S3_URI}/ into ${ROBOTWIN_ENV_DIR}"
                set +e
                osmo data download --resume "${ROBOTWIN_ENV_S3_URI}/" "$ROBOTWIN_ENV_DIR"
                env_download_status=$?
                set -e
                if [ "$env_download_status" -ne 0 ]; then
                  echo "ERROR: failed to download RoboTwin conda env." >&2
                  exit 10
                fi
              fi

              if [ -e "${ROBOTWIN_ENV_DIR}/bin/python3.10" ]; then
                ROBOTWIN_PYTHON="${ROBOTWIN_ENV_DIR}/bin/python3.10"
              elif [ -e "${ROBOTWIN_ENV_DIR}/bin/python" ]; then
                ROBOTWIN_PYTHON="${ROBOTWIN_ENV_DIR}/bin/python"
              else
                found_robotwin_python="$(find "$ROBOTWIN_ENV_DIR" -path '*/bin/python' -print -quit 2>/dev/null || true)"
                if [ -n "$found_robotwin_python" ]; then
                  ROBOTWIN_PYTHON="$found_robotwin_python"
                fi
              fi

              if [ ! -e "$ROBOTWIN_PYTHON" ]; then
                echo "ERROR: could not locate RoboTwin Python under $ROBOTWIN_ENV_DIR." >&2
                find "$ROBOTWIN_ENV_DIR" -maxdepth 5 -path '*/bin/python*' -print | head -50
                exit 11
              fi

              chmod u+x "$ROBOTWIN_PYTHON" 2>/dev/null || true

              ROBOTWIN_BIN_DIR="$(dirname "$ROBOTWIN_PYTHON")"
              ROBOTWIN_PREFIX="$(dirname "$ROBOTWIN_BIN_DIR")"
              export CONDA_PREFIX="$ROBOTWIN_PREFIX"
              export PYTHONHOME="$ROBOTWIN_PREFIX"
              export PATH="${ROBOTWIN_BIN_DIR}:${PATH}"
              export LD_LIBRARY_PATH="${ROBOTWIN_PREFIX}/lib:${LD_LIBRARY_PATH:-}"
              export PYTHONPATH="/workspace/robotwin:${PYTHONPATH:-}"

              stdlib_repair_marker="${ROBOTWIN_PREFIX}/.robotwin_python310_stdlib_repaired"
              if [ -f "$stdlib_repair_marker" ]; then
                echo "Python 3.10 stdlib repair already marked complete."
              elif "$ROBOTWIN_PYTHON" - <<'PY'; then
            import site
            print("Python 3.10 stdlib already usable:", site.__file__)
            PY
                touch "$stdlib_repair_marker"
              elif [ -d "${ROBOTWIN_PREFIX}/lib/python3.1" ] && [ -d "${ROBOTWIN_PREFIX}/lib/python3.10" ]; then
                echo "Repairing missing Python 3.10 stdlib files from python3.1 mirror."
                cp -an "${ROBOTWIN_PREFIX}/lib/python3.1/." "${ROBOTWIN_PREFIX}/lib/python3.10/"
                touch "$stdlib_repair_marker"
              fi

              echo "Using RoboTwin Python: $ROBOTWIN_PYTHON"
              "$ROBOTWIN_PYTHON" -c 'import site; print("RoboTwin Python site:", site.__file__)'
              "$ROBOTWIN_PYTHON" - <<'PY'
            import mplib
            import open3d
            import sapien.core
            import transforms3d
            print("RoboTwin Python imports OK")
            PY
              export ROBOTWIN_PYTHON
            }

            ensure_cuda_toolkit_for_torch() {
              torch_cuda="$("$ROBOTWIN_PYTHON" - <<'PY'
            import torch
            print(torch.version.cuda or "")
            PY
            )"
              case "$torch_cuda" in
                12.4*) desired_cuda_home="/usr/local/cuda-12.4" ;;
                *)
                  echo "WARNING: unexpected RoboTwin torch CUDA version '$torch_cuda'; using existing CUDA_HOME if available."
                  desired_cuda_home="${CUDA_HOME:-/usr/local/cuda}"
                  ;;
              esac

              if [ ! -x "${desired_cuda_home}/bin/nvcc" ] && [ "$desired_cuda_home" = "/usr/local/cuda-12.4" ]; then
                echo "Installing CUDA toolkit 12.4 to match RoboTwin torch CUDA ${torch_cuda}."
                (
                  unset PYTHONHOME PYTHONPATH
                  export DEBIAN_FRONTEND=noninteractive
                  . /etc/os-release
                  cuda_repo_os="ubuntu$(printf '%s' "$VERSION_ID" | tr -d .)"
                  cuda_keyring_url="https://developer.download.nvidia.com/compute/cuda/repos/${cuda_repo_os}/x86_64/cuda-keyring_1.1-1_all.deb"
                  echo "Using CUDA apt repository ${cuda_repo_os}: ${cuda_keyring_url}"
                  apt-get update
                  apt-get install -y --no-install-recommends curl wget ca-certificates gnupg
                  curl -fsSL "$cuda_keyring_url" -o /tmp/cuda-keyring_1.1-1_all.deb
                  dpkg -i /tmp/cuda-keyring_1.1-1_all.deb
                  apt-get update
                  if [ "$cuda_repo_os" != "ubuntu2204" ]; then
                    echo "Adding ubuntu2204 CUDA repo because CUDA 12.4 packages are not published for ${cuda_repo_os}."
                    echo "deb [signed-by=/usr/share/keyrings/cuda-archive-keyring.gpg] https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/x86_64/ /" > /etc/apt/sources.list.d/cuda-ubuntu2204-x86_64.list
                    apt-get update
                  fi
                  apt-cache policy cuda-nvcc-12-4 cuda-cudart-dev-12-4 || true
                  apt-get install -y --no-install-recommends cuda-nvcc-12-4 cuda-cudart-dev-12-4
                )
              fi

              if [ ! -x "${desired_cuda_home}/bin/nvcc" ]; then
                echo "ERROR: expected nvcc at ${desired_cuda_home}/bin/nvcc but it is missing." >&2
                find /usr/local -maxdepth 3 -name nvcc -print 2>/dev/null || true
                exit 15
              fi

              export CUDA_HOME="$desired_cuda_home"
              export CUDA_PATH="$desired_cuda_home"
              export CUDACXX="${desired_cuda_home}/bin/nvcc"
              export PATH="${desired_cuda_home}/bin:${PATH}"
              export LD_LIBRARY_PATH="${desired_cuda_home}/lib64:${LD_LIBRARY_PATH:-}"
              export TORCH_CUDA_ARCH_LIST="8.9"
              export MAX_JOBS="${MAX_JOBS:-8}"
              echo "Using CUDA_HOME=${CUDA_HOME}"
              nvcc --version
            }

            install_curobo_runtime() {
              if "$ROBOTWIN_PYTHON" - <<'PY'; then
            import importlib.util
            raise SystemExit(0 if importlib.util.find_spec("curobo") else 1)
            PY
                echo "cuRobo already importable in RoboTwin runtime."
                return
              fi

              echo "cuRobo missing; installing from NVlabs/curobo into RoboTwin runtime."
              ensure_cuda_toolkit_for_torch
              CUROBO_CACHE_DIR="${CUROBO_CACHE_DIR:-${OSMO_CACHE_ROOT}/deps/curobo}"
              mkdir -p "$(dirname "$CUROBO_CACHE_DIR")"
