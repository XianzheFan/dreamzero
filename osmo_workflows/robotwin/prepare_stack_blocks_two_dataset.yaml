            TASK_CONFIG_NAME="demo_full_franka"

            echo "Checking existing converted dataset at ${CONVERTED_DATA_S3_URI}/"
            set +e
            osmo data download --resume "${CONVERTED_DATA_S3_URI}/" "$DATA_ROOT"
            converted_download_status=$?
            set -e
            if [ "$converted_download_status" -eq 0 ] && has_expected_lerobot_episodes "$DATA_ROOT"; then
              echo "Converted stack_blocks_two LeRobot v2 dataset already exists at ${CONVERTED_DATA_S3_URI}/"
              exit 0
            fi

            echo "Downloading DreamZero converter code from ${CODE_S3_URI}/"
            osmo data download --resume "${CODE_S3_URI}/" /workspace/code/dreamzero
            CODE_ROOT="/workspace/code/dreamzero"
            if [ ! -f "$CODE_ROOT/scripts/data/robotwin_to_lerobot_v2.py" ]; then
              found_converter="$(find /workspace/code -path '*/scripts/data/robotwin_to_lerobot_v2.py' -print -quit)"
              if [ -n "$found_converter" ]; then
                CODE_ROOT="$(dirname "$(dirname "$(dirname "$found_converter")")")"
              fi
            fi
            if [ ! -f "$CODE_ROOT/scripts/data/robotwin_to_lerobot_v2.py" ]; then
              echo "ERROR: did not find robotwin_to_lerobot_v2.py." >&2
              exit 12
            fi
            if [ -f "$CODE_ROOT/OSMO_CODE_COMMIT" ]; then
              echo "DreamZero code cache commit: $(cat "$CODE_ROOT/OSMO_CODE_COMMIT")"
            fi
            python - "$CODE_ROOT" <<'PY'
            import sys
            from pathlib import Path

            code_root = Path(sys.argv[1])
            converter = code_root / "scripts/data/robotwin_to_lerobot_v2.py"
            text = converter.read_text()

            if "_validate_joint_action_vector" not in text:
                helper = '''

            def _validate_joint_action_vector(traj: h5py.File, state: np.ndarray) -> None:
                """Check RoboTwin's canonical joint-action vector when present.

                The converter writes state/action from named component datasets so
                the layout is explicit. RoboTwin also stores the same value as
                /joint_action/vector; validating it catches silent left/right or
                gripper ordering drift in upstream collection code.
                """
                vector_path = "/joint_action/vector"
                if vector_path not in traj:
                    return

                vector = np.asarray(traj[vector_path][()], dtype=np.float32)
                if vector.shape != state.shape:
                    raise ValueError(
                        f"{vector_path} shape {vector.shape} does not match concatenated "
                        f"joint_action shape {state.shape}"
                    )

                if not np.allclose(vector, state, atol=1e-5, rtol=1e-5):
                    max_abs_diff = float(np.max(np.abs(vector - state)))
                    raise ValueError(
                        f"{vector_path} does not match concatenated left_arm, left_gripper, "
                        f"right_arm, right_gripper layout; max_abs_diff={max_abs_diff:.6g}"
                    )
            '''
                anchor = "def _decode_jpeg_stream"
                if anchor not in text:
                    raise SystemExit("failed to locate converter decode function for vector validator patch")
                text = text.replace(anchor, helper + "\n\n" + anchor, 1)

                state_anchor = "    assert state.shape == (T, STATE_DIM)\n\n    # Absolute next-step qpos target."
                state_replacement = (
                    "    assert state.shape == (T, STATE_DIM)\n"
                    "    _validate_joint_action_vector(traj, state)\n\n"
                    "    # Absolute next-step qpos target."
                )
                if state_anchor not in text:
                    raise SystemExit("failed to locate state assertion for vector validator patch")
                text = text.replace(state_anchor, state_replacement, 1)
                converter.write_text(text)
                print("Patched RoboTwin converter with joint_action/vector layout validation.")

            text = converter.read_text()
            if '"embodiment_tag": "robotwin"' not in text:
                if '"embodiment_tag": "robofactory"' not in text:
                    raise SystemExit("failed to locate converter embodiment_tag for robotwin namespace patch")
                text = text.replace('"embodiment_tag": "robofactory"', '"embodiment_tag": "robotwin"', 1)
                converter.write_text(text)
                print("Patched RoboTwin converter to write embodiment_tag=robotwin.")

            text = converter.read_text()
            for marker in (
                "_validate_joint_action_vector",
                "action = state[1:].copy()",
                "relative_stats_dreamzero.json",
                '"embodiment_tag": "robotwin"',
            ):
                if marker not in text:
                    raise SystemExit(f"converter marker missing after patch: {marker}")
            compile(text, str(converter), "exec")
            PY
            install_converter_deps

            echo "Checking existing raw stack_blocks_two demos at ${RAW_DATA_S3_URI}/"
            mkdir -p "$RAW_DATA_ROOT"
            set +e
            osmo data download --resume "${RAW_DATA_S3_URI}/" "$RAW_DATA_ROOT"
            raw_download_status=$?
            set -e
            normalize_robotwin_raw_layout "$RAW_DATA_ROOT"
            if ! has_expected_hdf5_episodes "$RAW_EPISODE_DIR" && \
               [ -n "${RAW_BOOTSTRAP_DATA_S3_URI:-}" ] && \
               [ "$RAW_BOOTSTRAP_DATA_S3_URI" != "$RAW_DATA_S3_URI" ]; then
              echo "Bootstrapping raw demos from ${RAW_BOOTSTRAP_DATA_S3_URI}/ before collecting more."
              set +e
              osmo data download --resume "${RAW_BOOTSTRAP_DATA_S3_URI}/" "$RAW_DATA_ROOT"
              bootstrap_download_status=$?
              set -e
              normalize_robotwin_raw_layout "$RAW_DATA_ROOT"
              echo "Raw bootstrap download status: ${bootstrap_download_status}"
            fi
            if has_expected_hdf5_episodes "$RAW_EPISODE_DIR"; then
              echo "Raw stack_blocks_two demos already exist at ${RAW_DATA_S3_URI}/"
            else
              echo "Raw stack_blocks_two hdf5 episodes missing; collecting stack_blocks_two ${TASK_CONFIG_NAME} to ${ROBOTWIN_TARGET_EPISODES} episodes."
              configure_nvidia_graphics
              prepare_robotwin_runtime
              install_curobo_runtime
              ensure_ffmpeg
              echo "Downloading RoboTwin repo/assets from ${ROBOTWIN_S3_URI}/ into ${ROBOTWIN_REPO_CACHE}"
              osmo data download --resume "${ROBOTWIN_S3_URI}/" /workspace/robotwin
              link_legacy_robotwin_paths
              ensure_warp_runtime
              cd /workspace/robotwin
              "$ROBOTWIN_PYTHON" - <<'PY'
            from pathlib import Path

            robot_py = Path("/workspace/robotwin/envs/robot/robot.py")
            base_task_py = Path("/workspace/robotwin/envs/_base_task.py")
            if not robot_py.is_file():
                raise SystemExit(f"missing RoboTwin robot definition: {robot_py}")
            if not base_task_py.is_file():
                raise SystemExit(f"missing RoboTwin base task definition: {base_task_py}")

            robot_s = robot_py.read_text()
            base_task_s = base_task_py.read_text()
            checks = {
                "set_gripper declares gripper_val in [0,1]": "gripper_val in [0,1]" in robot_s,
                "set_gripper clips gripper_val to [0,1]": "np.clip(gripper_val, 0, 1)" in robot_s,
                "left normalized real gripper is clipped to [0,1]": "np.clip(normal_left_gripper_val, 0, 1)" in robot_s,
                "right normalized real gripper is clipped to [0,1]": "np.clip(normal_right_gripper_val, 0, 1)" in robot_s,
                "open threshold uses high gripper values": "left_gripper_val > 0.8" in robot_s and "right_gripper_val > 0.8" in robot_s,
                "close threshold uses low gripper values": "left_gripper_val < 0.2" in robot_s and "right_gripper_val < 0.2" in robot_s,
                "close_gripper default is 0.0": "def close_gripper(self, arm_tag: ArmTag, pos: float = 0.0)" in base_task_s,
                "open_gripper default is 1.0": "def open_gripper(self, arm_tag: ArmTag, pos: float = 1.0)" in base_task_s,
                "together close defaults to 0": "def together_close_gripper(self, save_freq=-1, left_pos=0, right_pos=0)" in base_task_s,
                "together open defaults to 1": "def together_open_gripper(self, save_freq=-1, left_pos=1, right_pos=1)" in base_task_s,
            }
            missing = [name for name, ok in checks.items() if not ok]
            if missing:
                raise SystemExit(
                    "RoboTwin gripper convention self-check failed; expected range=[0,1], "
                    "open=1.0, close=0.0. Missing markers: " + ", ".join(missing)
                )
            print("RoboTwin gripper convention self-check passed: range=[0,1], open=1.0, close=0.0")
            PY
              "$ROBOTWIN_PYTHON" - <<'PY'
            import os
            from pathlib import Path
            import yaml

            task_config_name = "demo_full_franka"
            target = int(os.environ["ROBOTWIN_TARGET_EPISODES"])
            extra = int(os.environ.get("ROBOTWIN_COLLECT_EXTRA_SEEDS", "0"))
            collect_target = target + max(extra, 0)
            config = Path("task_config") / f"{task_config_name}.yml"
            if not config.is_file():
                raise SystemExit(f"missing RoboTwin task config: {config}")
            data = yaml.safe_load(config.read_text())
            old = data.get("episode_num")
            data["episode_num"] = collect_target
            config.write_text(yaml.safe_dump(data, sort_keys=False))
            print(
                f"Patched {config}: episode_num {old} -> {collect_target} "
                f"(target={target}, extra_seed_pool={extra})"
            )
            PY
              patch_robotwin_collect_data_skip_failed_replays
              drop_last_partial_episode_if_needed
              collect_robotwin_until_expected
              if ! has_expected_hdf5_episodes "$RAW_EPISODE_DIR"; then
                echo "ERROR: collection finished but expected hdf5 episodes were not found under $RAW_EPISODE_DIR" >&2
                exit 13
