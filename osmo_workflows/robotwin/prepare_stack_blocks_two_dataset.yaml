              echo "Uploading raw stack_blocks_two demos to ${RAW_DATA_S3_URI}/"
              osmo data upload "${RAW_DATA_S3_URI}/" "$RAW_DATA_ROOT"
            fi

            cd "$CODE_ROOT"
            echo "Inspecting raw RoboTwin stack_blocks_two HDF5 demos before conversion."
            python scripts/data/inspect_robotwin_raw_hdf5.py \
              --episode-dir "$RAW_EPISODE_DIR" \
