              --allow-static-gripper

            echo "Converting raw demos to LeRobot v2 at $DATA_ROOT"
            rm -rf "$DATA_ROOT"
            python scripts/data/robotwin_to_lerobot_v2.py \
              --episode-dir "$RAW_EPISODE_DIR" \
              --out "$DATA_ROOT" \
              --task "stack the two blocks" \
              --num-episodes "${ROBOTWIN_NUM_EPISODES:--1}"

            if ! has_expected_lerobot_episodes "$DATA_ROOT"; then
              echo "ERROR: conversion finished but expected LeRobot episodes are missing at $DATA_ROOT" >&2
              exit 14
            fi

            echo "Uploading converted LeRobot v2 dataset to ${CONVERTED_DATA_S3_URI}/"
            osmo data upload "${CONVERTED_DATA_S3_URI}/" "$DATA_ROOT"
            echo "Prepared persistent RoboTwin stack_blocks_two dataset at ${CONVERTED_DATA_S3_URI}/"

