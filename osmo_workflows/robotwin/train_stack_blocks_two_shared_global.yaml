workflow:
  timeout:
    queue_timeout: 2h
    exec_timeout: 14d
  name: "{{workflow_name}}"
  resources:
    default:
      cpu: 80
      gpu: 8
      memory: 800Gi
      storage: 800Gi
  tasks:
    - name: train
      image: nvcr.io/nvidian/gear-h100-train:latest
      credentials:
        gear-aws-cred:
          AWS_ACCESS_KEY_ID: aws_access_key_id
          AWS_SECRET_ACCESS_KEY: aws_secret_access_key
          AWS_DEFAULT_REGION: aws_default_region
          AWS_ENDPOINT_URL: aws_endpoint_url
        gear-data-credentials:
          GEAR_DATA_CREDENTIALS: data_credentials
        wandb-api-key:
          WANDB_API_KEY: WANDB_API_KEY
      command: ["bash"]
      environment:
        ACCEPT_EULA: "Y"
        NO_NUCLEUS: "Y"
      exitActions:
        RESCHEDULE: 3001
      args: ["/tmp/train_stack_blocks_two.sh"]
      files:
        - path: /tmp/train_stack_blocks_two.sh
          contents: |
            #!/usr/bin/env bash
            set -euo pipefail

            exec > >(tee /tmp/train_stack_blocks_two.log) 2>&1

            RUN_NAME="${RUN_NAME:-{{run_name}}}"
            RESTORE_RUN_NAME="${RESTORE_RUN_NAME:-{{restore_run_name}}}"
            CODE_S3_URI="${CODE_S3_URI:-{{code_s3_uri}}}"
            DATA_VARIANT="${DATA_VARIANT:-{{data_variant}}}"
            EXPECTED_DATA_EPISODES="${EXPECTED_DATA_EPISODES:-{{expected_data_episodes}}}"
            CONVERTED_DATA_S3_URI="${CONVERTED_DATA_S3_URI:-{{converted_data_s3_uri}}}"
            MODEL_CACHE_S3_URI="s3://GearHome/users/xianzhef/oci-migration/checkpoints"
            RUN_S3_ROOT="s3://GearHome/users/xianzhef/oci-migration/dreamzero_runs/${RUN_NAME}"
            OUTPUT_S3_URI="${RUN_S3_ROOT}/checkpoints"
            LOG_S3_URI="${RUN_S3_ROOT}/logs"
            BOOTSTRAP_RESTORE_S3_URI="${BOOTSTRAP_RESTORE_S3_URI:-s3://GearHome/users/xianzhef/oci-migration/dreamzero_s3cache/bootstrap_checkpoints/${RUN_NAME}}"
            CACHE_OUTPUT_S3_URI="${CACHE_OUTPUT_S3_URI:-${BOOTSTRAP_RESTORE_S3_URI}}"
            BOOTSTRAP_RESTORE_AMLFS_DIR="${BOOTSTRAP_RESTORE_AMLFS_DIR:-/mnt/amlfs-01/home/xianzhef/osmo_cache/dreamzero/bootstrap_checkpoints/${RUN_NAME}}"
            OUTPUT_AMLFS_DIR="${OUTPUT_AMLFS_DIR:-/mnt/amlfs-01/home/xianzhef/osmo_cache/dreamzero/train_outputs/${RUN_NAME}}"
            RESTORE_S3_URI="${RESTORE_S3_URI:-s3://GearHome/users/xianzhef/oci-migration/dreamzero_runs/${RESTORE_RUN_NAME}/checkpoints}"
            RESTORE_EVAL_CKPT_S3_URI="${RESTORE_EVAL_CKPT_S3_URI:-s3://GearHome/users/xianzhef/oci-migration/dreamzero_runs/${RESTORE_RUN_NAME}/eval_checkpoints}"
            CHECKPOINT_UPLOAD_INTERVAL_SECONDS="${CHECKPOINT_UPLOAD_INTERVAL_SECONDS:-900}"

            for uri in "$CODE_S3_URI" "$CONVERTED_DATA_S3_URI" "$MODEL_CACHE_S3_URI" "$RUN_S3_ROOT" "$OUTPUT_S3_URI" "$LOG_S3_URI" "$BOOTSTRAP_RESTORE_S3_URI" "$CACHE_OUTPUT_S3_URI" "$RESTORE_S3_URI" "$RESTORE_EVAL_CKPT_S3_URI"; do
              case "$uri" in
                s3://GearHome/users/xianzhef/*) ;;
                swift://pdx.s8k.io/AUTH_team-gear/datasets/users/xianzhef/*) ;;
                *)
                  echo "Refusing non-xianzhef data URI: $uri" >&2
                  exit 64
                  ;;
              esac
            done

            for path in "$BOOTSTRAP_RESTORE_AMLFS_DIR" "$OUTPUT_AMLFS_DIR"; do
              case "$path" in
                /mnt/amlfs-01/home/xianzhef/*) ;;
                *)
                  echo "Refusing non-xianzhef AMLFS path: $path" >&2
                  exit 64
                  ;;
              esac
            done

            upload_artifacts() {
              status=$?
              set +e
              if [ -n "${PERIODIC_UPLOADER_PID:-}" ] && kill -0 "$PERIODIC_UPLOADER_PID" 2>/dev/null; then
                echo "Stopping periodic checkpoint uploader pid=${PERIODIC_UPLOADER_PID}"
                kill "$PERIODIC_UPLOADER_PID" 2>/dev/null || true
                wait "$PERIODIC_UPLOADER_PID" 2>/dev/null || true
              fi
              echo "Training workflow exit status: $status"
              osmo data upload "${LOG_S3_URI}/" /tmp/train_stack_blocks_two.log
              if declare -f upload_eval_checkpoints_once >/dev/null 2>&1; then
                upload_eval_checkpoints_once || true
              else
                echo "Eval-checkpoint uploader was not initialized yet."
              fi
              exit "$status"
            }
            trap upload_artifacts EXIT

            export PYTHONUNBUFFERED=1
            export HYDRA_FULL_ERROR=1
            export MUJOCO_GL=egl
            export CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
            export GIT_LFS_SKIP_SMUDGE=1
            export OSMO_CACHE_ROOT="${OSMO_CACHE_ROOT:-/mnt/amlfs-01/home/xianzhef/osmo_cache}"
            export DREAMZERO_CACHE_ROOT="${DREAMZERO_CACHE_ROOT:-${OSMO_CACHE_ROOT}/dreamzero}"
            export BOOTSTRAP_RESTORE_S3_URI
            export CACHE_OUTPUT_S3_URI
            export BOOTSTRAP_RESTORE_AMLFS_DIR
            export OUTPUT_AMLFS_DIR
            export HF_HOME="${DREAMZERO_CACHE_ROOT}/hf"
            export HF_HUB_CACHE="${HF_HOME}/hub"
            export TRANSFORMERS_CACHE="${HF_HOME}/transformers"
            export WANDB_DIR="${DREAMZERO_CACHE_ROOT}/wandb"
            export WANDB_CACHE_DIR="${WANDB_DIR}/cache"
            export WANDB_RESUME=allow
            export UPLOAD_MODEL_CACHE="${UPLOAD_MODEL_CACHE:-0}"

            mkdir -p \
              /workspace/code/dreamzero \
              /workspace/data/robotwin_lerobot_v2 \
              "${DREAMZERO_CACHE_ROOT}/checkpoints" \
              "${DREAMZERO_CACHE_ROOT}/train_outputs" \
              /workspace/outputs \
              "$HF_HOME" \
              "$WANDB_CACHE_DIR"

            ln -sfn "${DREAMZERO_CACHE_ROOT}/checkpoints" /workspace/checkpoints
            echo "Using persistent OSMO cache root: $OSMO_CACHE_ROOT"
            df -h "$OSMO_CACHE_ROOT" || true

            dir_has_files() {
              [ -d "$1" ] && [ -n "$(find "$1" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]
            }

            has_lerobot_meta() {
              [ -d "$1/meta" ] && [ -f "$1/meta/info.json" ] && [ -f "$1/meta/modality.json" ]
            }

            resolve_lerobot_root() {
              root="$1"
              if has_lerobot_meta "$root"; then
                printf '%s\n' "$root"
                return 0
              fi

              meta_file="$(find "$root" -maxdepth 4 -path "*/meta/info.json" -print -quit 2>/dev/null || true)"
              if [ -n "$meta_file" ]; then
                dirname "$(dirname "$meta_file")"
                return 0
              fi

              return 1
            }

            hf_download() {
              repo="$1"
              repo_type="$2"
              dest="$3"
              mkdir -p "$dest"
              if command -v hf >/dev/null 2>&1; then
                hf download "$repo" --repo-type "$repo_type" --local-dir "$dest"
              else
                huggingface-cli download "$repo" --repo-type "$repo_type" --local-dir "$dest"
              fi
            }

            model_dir_is_usable() {
              cache_name="$1"
              dest="$2"
              case "$cache_name" in
                Wan2.1-I2V-14B-480P)
                  [ -f "$dest/Wan2.1_VAE.pth" ] &&
                    [ -f "$dest/models_t5_umt5-xxl-enc-bf16.pth" ] &&
                    [ -f "$dest/models_clip_open-clip-xlm-roberta-large-vit-huge-14.pth" ]
                  ;;
                DreamZero-DROID)
                  [ -f "$dest/model.safetensors" ] || [ -f "$dest/model.safetensors.index.json" ]
                  ;;
                *)
                  dir_has_files "$dest"
                  ;;
              esac
            }

            resolve_model_root() {
              cache_name="$1"
              dest="$2"
              if model_dir_is_usable "$cache_name" "$dest"; then
                printf '%s\n' "$dest"
                return 0
              fi

              case "$cache_name" in
                Wan2.1-I2V-14B-480P)
                  root="$(find "$dest" -maxdepth 3 -name Wan2.1_VAE.pth -print -quit 2>/dev/null || true)"
                  ;;
                DreamZero-DROID)
                  root="$(find "$dest" -maxdepth 3 \( -name model.safetensors -o -name model.safetensors.index.json \) -print -quit 2>/dev/null || true)"
                  ;;
                *)
                  root=""
                  ;;
              esac

              if [ -n "${root:-}" ]; then
                dirname "$root"
                return 0
              fi

              return 1
            }

            promote_model_root() {
              resolved="$1"
              dest="$2"
              if [ "$resolved" = "$dest" ]; then
                return 0
              fi
              echo "Promoting nested model cache from ${resolved} into ${dest}."
              case "$resolved" in
                "$dest"/*)
                  find "$resolved" -mindepth 1 -maxdepth 1 -exec mv -n -t "$dest" {} +
                  ;;
                *)
                  cp -an "${resolved}/." "$dest/"
                  ;;
              esac
            }

            download_or_restore_model() {
              cache_name="$1"
              repo="$2"
              repo_type="$3"
              dest="$4"
              mkdir -p "$dest"

              if model_dir_is_usable "$cache_name" "$dest"; then
                echo "Model already present locally: $dest"
                return 0
              fi

              echo "Trying xianzhef S3 model cache: ${MODEL_CACHE_S3_URI}/${cache_name}/"
              set +e
              osmo data download --resume "${MODEL_CACHE_S3_URI}/${cache_name}/" "$dest"
              cache_status=$?
              set -e
              resolved_cache_root="$(resolve_model_root "$cache_name" "$dest" || true)"

              if [ "$cache_status" -eq 0 ] && [ -n "$resolved_cache_root" ]; then
                promote_model_root "$resolved_cache_root" "$dest"
                echo "Restored ${cache_name} from xianzhef S3 cache."
                return 0
              fi

              if ! command -v huggingface-cli >/dev/null 2>&1 && ! command -v hf >/dev/null 2>&1; then
                python -m pip install -q "huggingface_hub[cli]"
              fi

              echo "No usable S3 cache for ${cache_name}; downloading from Hugging Face repo ${repo}."
              hf_download "$repo" "$repo_type" "$dest"
              resolved_download_root="$(resolve_model_root "$cache_name" "$dest" || true)"
              if [ -n "$resolved_download_root" ]; then
                promote_model_root "$resolved_download_root" "$dest"
              fi
              if ! model_dir_is_usable "$cache_name" "$dest"; then
                echo "ERROR: downloaded ${cache_name} into ${dest}, but required checkpoint files are still missing." >&2
                exit 8
              fi

              if [ "${UPLOAD_MODEL_CACHE:-1}" = "1" ]; then
                echo "Uploading ${cache_name} to xianzhef S3 model cache."
                set +e
                osmo data upload "${MODEL_CACHE_S3_URI}/${cache_name}/" "$dest"
                upload_status=$?
                set -e
                if [ "$upload_status" -ne 0 ]; then
                  echo "WARNING: failed to upload model cache ${cache_name}; training will still continue."
                fi
              fi
            }

            valid_tokenizer_dir() {
              [ -f "$1/tokenizer_config.json" ] && { [ -f "$1/tokenizer.json" ] || [ -f "$1/spiece.model" ]; }
            }

            download_or_restore_tokenizer() {
              cache_name="$1"
              repo="$2"
              dest="$3"
              mkdir -p "$dest"

              if valid_tokenizer_dir "$dest"; then
                echo "Tokenizer already present locally: $dest"
                return 0
              fi

              echo "Trying xianzhef S3 tokenizer cache: ${MODEL_CACHE_S3_URI}/${cache_name}/"
              set +e
              osmo data download --resume "${MODEL_CACHE_S3_URI}/${cache_name}/" "$dest"
              cache_status=$?
              set -e

              if [ "$cache_status" -eq 0 ] && valid_tokenizer_dir "$dest"; then
                echo "Restored ${cache_name} from xianzhef S3 cache."
                return 0
              fi

              python - <<'PY'
            import importlib.util
            import subprocess
            import sys

            if importlib.util.find_spec("huggingface_hub") is None:
                subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "huggingface_hub"])
            PY

              echo "Downloading tokenizer files from Hugging Face repo ${repo}."
              python - "$repo" "$dest" <<'PY'
            import sys
            from huggingface_hub import snapshot_download

            repo, dest = sys.argv[1], sys.argv[2]
            snapshot_download(
                repo_id=repo,
                repo_type="model",
                local_dir=dest,
                allow_patterns=[
                    "config.json",
                    "special_tokens_map.json",
                    "spiece.model",
                    "tokenizer.json",
                    "tokenizer_config.json",
                ],
            )
            PY

              if ! valid_tokenizer_dir "$dest"; then
                echo "ERROR: tokenizer cache ${dest} is still missing tokenizer_config.json plus tokenizer.json or spiece.model." >&2
                exit 7
              fi

              if [ "${UPLOAD_MODEL_CACHE:-1}" = "1" ]; then
                echo "Uploading ${cache_name} to xianzhef S3 model cache."
                set +e
                osmo data upload "${MODEL_CACHE_S3_URI}/${cache_name}/" "$dest"
                upload_status=$?
                set -e
                if [ "$upload_status" -ne 0 ]; then
                  echo "WARNING: failed to upload tokenizer cache ${cache_name}; training will still continue."
                fi
              fi
            }

            require_wandb() {
              if [ -z "${WANDB_API_KEY:-}" ]; then
                echo "ERROR: REPORT_TO=wandb but WANDB_API_KEY is not set." >&2
                exit 5
              fi
              python - <<'PY'
            import importlib.util
            import subprocess
            import sys

            if importlib.util.find_spec("wandb") is None:
                subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "wandb"])
            PY
              python -c 'import os, wandb; wandb.login(key=os.environ["WANDB_API_KEY"], relogin=True)'
            }

            echo "Downloading persistent converted RoboTwin stack_blocks_two dataset ${DATA_VARIANT} from ${CONVERTED_DATA_S3_URI}/"
            DATA_PARENT="/workspace/data/robotwin_lerobot_v2"
            DATA_ROOT="${DATA_PARENT}/${DATA_VARIANT}"
            mkdir -p "$DATA_PARENT"
            set +e
            osmo data download --resume "${CONVERTED_DATA_S3_URI}/" "$DATA_PARENT"
            converted_download_status=$?
            set -e

            RESOLVED_DATA_ROOT="$(resolve_lerobot_root "$DATA_ROOT" || true)"
            if [ "$converted_download_status" -ne 0 ] || [ -z "$RESOLVED_DATA_ROOT" ]; then
              echo "ERROR: persistent stack_blocks_two LeRobot v2 dataset ${DATA_VARIANT} is missing at ${CONVERTED_DATA_S3_URI}/" >&2
              echo "Run prepare_dataset_workflow.yaml once, then resubmit this training workflow." >&2
              exit 9
            fi
            DATA_ROOT="$RESOLVED_DATA_ROOT"
            echo "Using RoboTwin LeRobot dataset root: $DATA_ROOT"

            echo "Downloading DreamZero code from ${CODE_S3_URI}/"
            osmo data download --resume "${CODE_S3_URI}/" /workspace/code/dreamzero
            CODE_ROOT="/workspace/code/dreamzero"
            LATEST_CODE_ROOT="${CODE_ROOT}/dreamzero_gripperfix_upload_latest"
            if [ -f "${LATEST_CODE_ROOT}/pyproject.toml" ]; then
              CODE_ROOT="$LATEST_CODE_ROOT"
            elif [ ! -f "$CODE_ROOT/pyproject.toml" ]; then
              found_pyproject="$(find /workspace/code -maxdepth 4 -name pyproject.toml -print | sort | tail -n 1)"
              if [ -n "$found_pyproject" ]; then
                CODE_ROOT="$(dirname "$found_pyproject")"
              fi
            fi
            if [ ! -f "$CODE_ROOT/pyproject.toml" ]; then
              echo "ERROR: did not find DreamZero pyproject.toml after code download." >&2
              exit 3
            fi
            if [ -f "$CODE_ROOT/OSMO_CODE_COMMIT" ]; then
              echo "DreamZero code cache commit: $(cat "$CODE_ROOT/OSMO_CODE_COMMIT")"
            fi
            if [ ! -f "$CODE_ROOT/scripts/train/robotwin_bimanual_training.sh" ]; then
              echo "ERROR: DreamZero code does not contain scripts/train/robotwin_bimanual_training.sh." >&2
              exit 6
            fi

            require_code_marker() {
              local file="$1"
              shift
              local marker
              if [ ! -f "$CODE_ROOT/$file" ]; then
                echo "ERROR: expected code file missing: $file" >&2
                exit 7
              fi
              for marker in "$@"; do
                if ! grep -Fq "$marker" "$CODE_ROOT/$file"; then
                  echo "ERROR: code marker missing in $file: $marker" >&2
                  exit 7
                fi
              done
            }

            install_workflow_fallbacks() {
              if [ ! -f "$CODE_ROOT/scripts/data/inspect_robotwin_lerobot.py" ]; then
                echo "Installing workflow-local RoboTwin LeRobot inspector fallback."
                mkdir -p "$CODE_ROOT/scripts/data"
                cat > "$CODE_ROOT/scripts/data/inspect_robotwin_lerobot.py" <<'PY'
            from __future__ import annotations

            import argparse
            import json
            from pathlib import Path

            import numpy as np
            import pandas as pd


            def parse_dims(value: str) -> tuple[int, ...]:
                dims = tuple(int(part.strip()) for part in value.split(",") if part.strip())
                if not dims:
                    raise ValueError("empty gripper dims")
                return dims


            def read_jsonl(path: Path) -> list[dict]:
                rows = []
                with path.open() as f:
                    for line in f:
                        line = line.strip()
                        if line:
                            rows.append(json.loads(line))
                return rows


            def stack_column(df: pd.DataFrame, column: str) -> np.ndarray:
                return np.stack([np.asarray(value, dtype=np.float32) for value in df[column]], axis=0)


            def stats_vector(stats: dict, key: str, stat_name: str, expected_dim: int) -> np.ndarray:
                values = stats[key][stat_name]
                arr = np.asarray(values, dtype=np.float32)
                if arr.shape != (expected_dim,):
                    raise SystemExit(
                        f"meta/stats.json {key}.{stat_name} shape {arr.shape} "
                        f"does not match expected dim {(expected_dim,)}"
                    )
                return arr


            def normalize_q99_value(value: float, q01: float, q99: float) -> float | None:
                if q01 == q99:
                    return None
                return float(np.clip(2.0 * (value - q01) / (q99 - q01) - 1.0, -1.0, 1.0))


            def main() -> None:
                parser = argparse.ArgumentParser()
                parser.add_argument("--root", type=Path, required=True)
                parser.add_argument("--expected-episodes", type=int, required=True)
                parser.add_argument("--expected-action-dim", type=int, default=16)
                parser.add_argument("--expected-state-dim", type=int, default=16)
                parser.add_argument("--gripper-dims", type=parse_dims, default=(7, 15))
                parser.add_argument("--close-threshold", type=float, default=0.5)
                parser.add_argument("--gripper-min", type=float, default=0.0)
                parser.add_argument("--gripper-max", type=float, default=1.0)
                parser.add_argument("--gripper-range-epsilon", type=float, default=1e-4)
                args = parser.parse_args()

                root = args.root.resolve()
                info = json.loads((root / "meta/info.json").read_text())
                metadata_stats = json.loads((root / "meta/stats.json").read_text())
                episodes = read_jsonl(root / "meta/episodes.jsonl")
                if len(episodes) < args.expected_episodes:
                    raise SystemExit(
                        f"dataset has {len(episodes)} episodes, expected at least {args.expected_episodes}"
                    )

                action_dim = int(info["features"]["action"]["shape"][0])
                state_dim = int(info["features"]["observation.state"]["shape"][0])
                if action_dim != args.expected_action_dim:
                    raise SystemExit(f"action dim mismatch: got {action_dim}, expected {args.expected_action_dim}")
                if state_dim != args.expected_state_dim:
                    raise SystemExit(f"state dim mismatch: got {state_dim}, expected {args.expected_state_dim}")
                action_q01 = stats_vector(metadata_stats, "action", "q01", action_dim)
                action_q99 = stats_vector(metadata_stats, "action", "q99", action_dim)

                data_path = info["data_path"]
                chunks_size = int(info.get("chunks_size", 1000))
                actions = []
                frames_read = 0
                for episode in episodes:
                    episode_index = int(episode["episode_index"])
                    rel = data_path.format(
                        episode_chunk=episode_index // chunks_size,
                        episode_index=episode_index,
                    )
                    df = pd.read_parquet(root / rel)
                    action = stack_column(df, "action")
                    if action.shape[1] != action_dim:
                        raise SystemExit(f"{rel} action shape {action.shape} does not match {action_dim}")
                    actions.append(action)
                    frames_read += int(action.shape[0])

                action_all = np.concatenate(actions, axis=0)
                gripper = {}
                for dim in args.gripper_dims:
                    if dim < 0 or dim >= action_dim:
                        raise SystemExit(f"gripper dim {dim} outside action dim {action_dim}")
                    values = action_all[:, dim].astype(np.float32)
                    unique = np.unique(np.round(values, 4))
                    close_fraction = float(np.mean(values < args.close_threshold))
                    value_min = float(values.min())
                    value_max = float(values.max())
                    if value_min < args.gripper_min - args.gripper_range_epsilon or value_max > args.gripper_max + args.gripper_range_epsilon:
                        raise SystemExit(
                            f"gripper dim {dim} is outside expected Robotwin range "
                            f"[{args.gripper_min}, {args.gripper_max}]: min={value_min}, max={value_max}"
                        )
                    q01 = float(action_q01[dim])
                    q99 = float(action_q99[dim])
                    stats = {
                        "min": value_min,
                        "max": value_max,
                        "mean": float(values.mean()),
                        "std": float(values.std()),
                        "q01": q01,
                        "q99": q99,
                        "close_fraction_raw_lt_threshold": close_fraction,
                        "normalized_close_threshold_q99": normalize_q99_value(
                            args.close_threshold,
                            q01,
                            q99,
                        ),
                        "normalized_min_q99": normalize_q99_value(value_min, q01, q99),
                        "normalized_max_q99": normalize_q99_value(value_max, q01, q99),
                        "unique_rounded_count": int(len(unique)),
                    }
                    if stats["unique_rounded_count"] < 2:
                        raise SystemExit(f"gripper dim {dim} is static: {stats}")
                    if close_fraction <= 0.0 or close_fraction >= 1.0:
                        raise SystemExit(f"gripper dim {dim} has no open/close mix: {stats}")
                    gripper[f"dim_{dim}"] = stats

                print(json.dumps({
                    "root": str(root),
                    "episodes": len(episodes),
                    "frames_read": frames_read,
                    "action_dim": action_dim,
                    "state_dim": state_dim,
                    "gripper_dims": list(args.gripper_dims),
                    "raw_close_threshold": args.close_threshold,
                    "expected_gripper_range": [args.gripper_min, args.gripper_max],
                    "gripper_range_epsilon": args.gripper_range_epsilon,
                    "action_gripper": gripper,
                }, indent=2, sort_keys=True))


            if __name__ == "__main__":
                main()
            PY
              fi

              python - "$CODE_ROOT" <<'PY'
            import sys
            from pathlib import Path

            code_root = Path(sys.argv[1])
            base_py = code_root / "groot/vla/experiment/base.py"
            text = base_py.read_text()
            if "gripper_binary_action_loss_avg" in text:
                raise SystemExit(0)

            if '"gripper_clean_action_loss_avg",' in text:
                text = text.replace(
                    '            "gripper_clean_action_loss_avg",\n            "learning_rate",',
                    '            "gripper_clean_action_loss_avg",\n            "gripper_binary_action_loss_avg",\n            "learning_rate",',
                    1,
                )
            else:
                text = text.replace(
                    '            "action_loss_avg",\n            "learning_rate",',
