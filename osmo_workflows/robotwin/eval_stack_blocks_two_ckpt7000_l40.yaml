                    '        if self.gripper_force_open_until_infer < 0:\n'
                    '            raise ValueError("gripper_force_open_until_infer must be >= 0")\n'
                    '        self._gripper_hold_remaining = np.zeros(2, dtype=np.int32)\n'
                )
                if init_old not in deploy_s:
                    raise SystemExit("did not find debug_interval init line for gripper hold patch")
                deploy_s = deploy_s.replace(init_old, init_new, 1)

                reset_old = (
                    '        self.session_id = uuid.uuid4().hex\n'
                    '        self._needs_reset = True\n'
                    '        self._infer_count = 0\n'
                )
                reset_new = reset_old + '        self._gripper_hold_remaining[:] = 0\n'
                if reset_old not in deploy_s:
