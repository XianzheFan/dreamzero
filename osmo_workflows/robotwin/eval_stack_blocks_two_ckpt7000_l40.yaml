            gripper_hold_steps = int(os.environ.get("DREAMZERO_GRIPPER_CLOSE_HOLD_STEPS", "0") or "0")
            gripper_force_open_until_infer = int(os.environ.get("DREAMZERO_GRIPPER_FORCE_OPEN_UNTIL_INFER", "0") or "0")
