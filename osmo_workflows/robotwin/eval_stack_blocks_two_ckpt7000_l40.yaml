                    raise SystemExit("did not find debug grip line for gripper hold patch")
                deploy_s = deploy_s.replace(debug_old, debug_new, 1)
                compile(deploy_s, str(deploy), "exec")
                for marker in ("_apply_gripper_close_hold", "_force_gripper_open_until_infer", "DREAMZERO_GRIPPER_CLOSE_HOLD_STEPS", "hold=("):
                    if marker not in deploy_s:
                        raise SystemExit(f"gripper hold patch marker missing after patch: {marker}")
