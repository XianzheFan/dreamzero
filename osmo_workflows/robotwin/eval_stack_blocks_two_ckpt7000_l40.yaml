                deploy_s = deploy_s.replace(reset_old, reset_new, 1)

                method_anchor = '    def _as_abs_action_chunk(self, action_chunk: np.ndarray, qpos: np.ndarray) -> list[np.ndarray]:\n'
                hold_method = (
