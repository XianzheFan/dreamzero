workflow:
  timeout:
    queue_timeout: 2h
    exec_timeout: 8h
  name: "{{workflow_name}}"
  resources:
    default:
      cpu: 31
      gpu: 2
      memory: 240Gi
      storage: 720Gi
  tasks:
    - name: eval-stack
      image: nvcr.io/nvidian/gr00t_isaac:v1.5
      command: ["bash"]
      credentials:
        gear-aws-cred:
          AWS_ACCESS_KEY_ID: aws_access_key_id
          AWS_SECRET_ACCESS_KEY: aws_secret_access_key
          AWS_DEFAULT_REGION: aws_default_region
          AWS_ENDPOINT_URL: aws_endpoint_url
        gear-data-credentials:
          GEAR_DATA_CREDENTIALS: data_credentials
      environment:
        ACCEPT_EULA: "Y"
        NO_NUCLEUS: "Y"
        NVIDIA_DRIVER_CAPABILITIES: "all"
        OSMO_CACHE_ROOT: "{{osmo_cache_root}}"
        EVAL_CKPT_ROOT: "{{eval_ckpt_root}}"
      args: ["/tmp/eval_stack_blocks_two.sh"]
      files:
        - path: /tmp/eval_stack_blocks_two.sh
          contents: |
            #!/usr/bin/env bash
            set -euo pipefail

            exec > >(tee /tmp/eval_stack_blocks_two.log) 2>&1

            RUN_NAME="{{workflow_name}}"
            SOURCE_TRAIN_RUN_NAME="{{source_train_run_name}}"
            CODE_S3_URI="s3://GearHome/users/xianzhef/oci-migration/dreamzero_gripperfix_20260601"
            MODEL_CACHE_S3_URI="s3://GearHome/users/xianzhef/oci-migration/checkpoints"
            EVAL_CKPT_S3_URI="${EVAL_CKPT_S3_URI:-s3://GearHome/users/xianzhef/oci-migration/dreamzero_s3cache/bootstrap_checkpoints/${SOURCE_TRAIN_RUN_NAME}}"
            EVAL_CKPT_FALLBACK_S3_URI="${EVAL_CKPT_FALLBACK_S3_URI:-s3://GearHome/users/xianzhef/oci-migration/dreamzero_runs/${SOURCE_TRAIN_RUN_NAME}/checkpoints}"
            RUN_S3_ROOT="s3://GearHome/users/xianzhef/oci-migration/dreamzero_runs/${RUN_NAME}"
            OUT_S3_URI="${RUN_S3_ROOT}/stack_blocks_two_{{ckpt_setting}}"
            OSMO_CACHE_ROOT="${OSMO_CACHE_ROOT:-/mnt/amlfs-04/home/xianzhef/osmo_cache}"
            DREAMZERO_CACHE_ROOT="${DREAMZERO_CACHE_ROOT:-${OSMO_CACHE_ROOT}/dreamzero}"
            DREAMZERO_VENV="${DREAMZERO_CACHE_ROOT}/venvs/server_py312_system"
            AMLFS_MODEL_CACHE_DIR="${DREAMZERO_CACHE_ROOT}/checkpoints"
            EVAL_CKPT_ROOT="${EVAL_CKPT_ROOT:-${DREAMZERO_CACHE_ROOT}/eval_ckpts/robotwin_stack_blocks_two_${SOURCE_TRAIN_RUN_NAME}_{{ckpt_setting}}}"
            ROBOTWIN_S3_URI="${ROBOTWIN_S3_URI:-s3://GearHome/users/xianzhef/oci-migration/RoboTwin}"
            ROBOTWIN_REPO_CACHE="${ROBOTWIN_REPO_CACHE:-${OSMO_CACHE_ROOT}/RoboTwin}"
            ROBOTWIN_ENV_DIR="${ROBOTWIN_ENV_DIR:-${OSMO_CACHE_ROOT}/robotwin_env}"
            CKPT_SETTING="{{ckpt_setting}}"
            PORT=5001
            TASK_NAME="stack_blocks_two"
            TASK_CONFIG="demo_full_franka"
            SEED=0
            NUM_EPISODES="{{num_episodes}}"
            CLIENT_TIMEOUT_SECONDS="{{client_timeout_seconds}}"
            DREAMZERO_PROMPT_OVERRIDE="${DREAMZERO_PROMPT_OVERRIDE:-{{prompt_override}}}"
            DREAMZERO_GRIPPER_BINARIZE_THRESHOLD="${DREAMZERO_GRIPPER_BINARIZE_THRESHOLD:-{{gripper_binarize_threshold}}}"
            DREAMZERO_GRIPPER_CLOSE_HOLD_STEPS="${DREAMZERO_GRIPPER_CLOSE_HOLD_STEPS:-{{gripper_close_hold_steps}}}"
            DREAMZERO_GRIPPER_CLOSE_HOLD_MIN_INFER="${DREAMZERO_GRIPPER_CLOSE_HOLD_MIN_INFER:-{{gripper_close_hold_min_infer}}}"
            DREAMZERO_GRIPPER_FORCE_OPEN_UNTIL_INFER="${DREAMZERO_GRIPPER_FORCE_OPEN_UNTIL_INFER:-{{gripper_force_open_until_infer}}}"
            DREAMZERO_GRIPPER_OVERRIDE="${DREAMZERO_GRIPPER_OVERRIDE:-{{gripper_override}}}"
            DREAMZERO_GRIPPER_CLOSE_AFTER_INFER="${DREAMZERO_GRIPPER_CLOSE_AFTER_INFER:-{{gripper_close_after_infer}}}"
            DREAMZERO_GRIPPER_CLOSE_VALUE="${DREAMZERO_GRIPPER_CLOSE_VALUE:-{{gripper_close_value}}}"
            export DREAMZERO_GRIPPER_CLOSE_HOLD_STEPS
            export DREAMZERO_GRIPPER_CLOSE_HOLD_MIN_INFER
            export DREAMZERO_GRIPPER_FORCE_OPEN_UNTIL_INFER

            for uri in "$CODE_S3_URI" "$MODEL_CACHE_S3_URI" "$EVAL_CKPT_S3_URI" "$EVAL_CKPT_FALLBACK_S3_URI" "$RUN_S3_ROOT" "$OUT_S3_URI" "$ROBOTWIN_S3_URI"; do
              case "$uri" in
                s3://GearHome/users/xianzhef/*) ;;
                *) echo "Refusing non-xianzhef S3 URI: $uri" >&2; exit 64 ;;
              esac
            done

            for path in "$OSMO_CACHE_ROOT" "$AMLFS_MODEL_CACHE_DIR" "$EVAL_CKPT_ROOT" "$ROBOTWIN_REPO_CACHE" "$ROBOTWIN_ENV_DIR"; do
              case "$path" in
                /mnt/amlfs-0[1-9]/home/xianzhef/*) ;;
                *) echo "Refusing non-xianzhef AMLFS path: $path" >&2; exit 64 ;;
              esac
            done

            upload_artifacts() {
              local status="${1:-$?}"
              set +e
              mkdir -p /workspace/robotwin_eval_outputs
              write_eval_diagnostic_summary "$status" || true
              cp -f /tmp/eval_stack_blocks_two.log /workspace/robotwin_eval_outputs/eval_stack_blocks_two.log
              if [ -f /tmp/server.log ]; then cp -f /tmp/server.log /workspace/robotwin_eval_outputs/server.log; fi
              if [ -f /tmp/client.log ]; then cp -f /tmp/client.log /workspace/robotwin_eval_outputs/client.log; fi
              if [ -d /workspace/robotwin/eval_result ]; then
                cp -a /workspace/robotwin/eval_result /workspace/robotwin_eval_outputs/eval_result
              fi
              echo "Uploading eval artifacts to ${OUT_S3_URI}/"
              osmo data upload "${OUT_S3_URI}/" /workspace/robotwin_eval_outputs
              exit "$status"
            }

            write_eval_diagnostic_summary() {
              local status="${1:-unknown}"
              local summary=/workspace/robotwin_eval_outputs/diagnostic_summary.txt
              {
                echo "workflow=${RUN_NAME}"
                echo "source_train_run=${SOURCE_TRAIN_RUN_NAME}"
                echo "ckpt_setting=${CKPT_SETTING}"
                echo "num_episodes=${NUM_EPISODES}"
                echo "client_timeout_seconds=${CLIENT_TIMEOUT_SECONDS}"
                echo "client_status=${status}"
                echo "prompt_override=${DREAMZERO_PROMPT_OVERRIDE}"
                echo "gripper_binarize_threshold=${DREAMZERO_GRIPPER_BINARIZE_THRESHOLD}"
                echo "gripper_close_hold_steps=${DREAMZERO_GRIPPER_CLOSE_HOLD_STEPS}"
                echo "gripper_close_hold_min_infer=${DREAMZERO_GRIPPER_CLOSE_HOLD_MIN_INFER}"
                echo "gripper_force_open_until_infer=${DREAMZERO_GRIPPER_FORCE_OPEN_UNTIL_INFER}"
                echo "gripper_override=${DREAMZERO_GRIPPER_OVERRIDE}"
                echo "gripper_close_after_infer=${DREAMZERO_GRIPPER_CLOSE_AFTER_INFER}"
                echo "gripper_close_value=${DREAMZERO_GRIPPER_CLOSE_VALUE}"
                echo "eval_ckpt_s3_uri=${EVAL_CKPT_S3_URI}"
                echo "eval_ckpt_fallback_s3_uri=${EVAL_CKPT_FALLBACK_S3_URI}"
                echo
                echo "== Client Success Lines =="
                if [ -f /tmp/client.log ]; then
                  grep -E "Success rate|success rate|Client timed out|Episode [0-9]+|instruction=|DreamZero/RoboTwin|mode=auto->" /tmp/client.log | tail -120 || true
                else
                  echo "client.log missing"
                fi
                echo
                echo "== Server Action Summaries =="
                if [ -f /tmp/server.log ]; then
                  grep "Action summary session=" /tmp/server.log | tail -120 || true
                else
                  echo "server.log missing"
                fi
                echo
                echo "== Result Files =="
                if [ -d /workspace/robotwin/eval_result ]; then
                  find /workspace/robotwin/eval_result -type f | sort | sed -n '1,120p'
                else
                  echo "eval_result missing"
                fi
              } > "$summary"
            }

            cleanup() {
              if [ -n "${SERVER_PID:-}" ] && kill -0 "$SERVER_PID" 2>/dev/null; then
                echo "Stopping policy server pid=${SERVER_PID}"
                kill "$SERVER_PID" 2>/dev/null || true
                wait "$SERVER_PID" 2>/dev/null || true
              fi
            }

            on_exit() {
              status=$?
              cleanup
              upload_artifacts "$status"
            }
            trap on_exit EXIT

            export PYTHONUNBUFFERED=1
            export HYDRA_FULL_ERROR=1
            export GIT_LFS_SKIP_SMUDGE=1
            export ATTENTION_BACKEND=flex
            export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
            export CUDA_MODULE_LOADING=LAZY
            export HF_HOME="${DREAMZERO_CACHE_ROOT}/hf"
            export HF_HUB_CACHE="${HF_HOME}/hub"
            export TRANSFORMERS_CACHE="${HF_HOME}/transformers"
            export NO_ALBUMENTATIONS_UPDATE=1
            export PIP_ROOT_USER_ACTION=ignore

            mkdir -p \
              /workspace/code \
              /workspace/code/dreamzero \
              /workspace/checkpoints \
              /workspace/eval_ckpts \
              /workspace/robotwin_eval_outputs \
              "$HF_HOME" \
              "$(dirname "$DREAMZERO_VENV")" \
              "$AMLFS_MODEL_CACHE_DIR" \
              "$EVAL_CKPT_ROOT"

            echo "Using persistent OSMO cache root: $OSMO_CACHE_ROOT"
            df -h "$OSMO_CACHE_ROOT" || true
            nvidia-smi || true

            dir_has_files() {
              [ -d "$1" ] && [ -n "$(find "$1" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]
            }

            hf_download() {
              repo="$1"
              repo_type="$2"
              dest="$3"
              mkdir -p "$dest"
              if command -v hf >/dev/null 2>&1; then
                hf download "$repo" --repo-type "$repo_type" --local-dir "$dest"
              else
                huggingface-cli download "$repo" --repo-type "$repo_type" --local-dir "$dest"
              fi
            }

            model_dir_is_usable() {
              cache_name="$1"
              dest="$2"
              case "$cache_name" in
                Wan2.1-I2V-14B-480P)
                  [ -f "$dest/Wan2.1_VAE.pth" ] &&
                    [ -f "$dest/models_t5_umt5-xxl-enc-bf16.pth" ] &&
                    [ -f "$dest/models_clip_open-clip-xlm-roberta-large-vit-huge-14.pth" ]
                  ;;
                DreamZero-DROID)
                  [ -f "$dest/model.safetensors" ] || [ -f "$dest/model.safetensors.index.json" ]
                  ;;
                umt5-xxl-tokenizer)
                  [ -f "$dest/tokenizer_config.json" ] && { [ -f "$dest/tokenizer.json" ] || [ -f "$dest/spiece.model" ]; }
                  ;;
                *)
                  dir_has_files "$dest"
                  ;;
              esac
            }

            resolve_model_root() {
              cache_name="$1"
              dest="$2"
              if model_dir_is_usable "$cache_name" "$dest"; then
                printf '%s\n' "$dest"
                return 0
              fi
              case "$cache_name" in
                Wan2.1-I2V-14B-480P)
                  root="$(find "$dest" -maxdepth 4 -name Wan2.1_VAE.pth -print -quit 2>/dev/null || true)"
                  ;;
                DreamZero-DROID)
                  root="$(find "$dest" -maxdepth 4 \( -name model.safetensors -o -name model.safetensors.index.json \) -print -quit 2>/dev/null || true)"
                  ;;
                umt5-xxl-tokenizer)
                  root="$(find "$dest" -maxdepth 4 -name tokenizer_config.json -print -quit 2>/dev/null || true)"
                  ;;
                *)
                  root=""
                  ;;
              esac
              if [ -n "${root:-}" ]; then
                dirname "$root"
                return 0
              fi
              return 1
            }

            promote_model_root() {
              resolved="$1"
              dest="$2"
              if [ "$resolved" = "$dest" ]; then
                return 0
              fi
              echo "Promoting nested model cache from ${resolved} into ${dest}."
              case "$resolved" in
                "$dest"/*)
                  find "$resolved" -mindepth 1 -maxdepth 1 -exec mv -n -t "$dest" {} + || true
                  cp -an "${resolved}/." "$dest/" || true
                  ;;
                *)
                  cp -an "${resolved}/." "$dest/"
                  ;;
              esac
            }

            download_or_restore_model() {
              cache_name="$1"
              repo="$2"
              repo_type="$3"
              dest="$4"
              mkdir -p "$dest"

              if model_dir_is_usable "$cache_name" "$dest"; then
                echo "Model/tokenizer already present locally: $dest"
                date -u +"%Y-%m-%dT%H:%M:%SZ" > "$dest/.cache_complete"
                return 0
              fi

              echo "Trying xianzhef S3 model cache: ${MODEL_CACHE_S3_URI}/${cache_name}/"
              set +e
              osmo data download --resume "${MODEL_CACHE_S3_URI}/${cache_name}/" "$dest"
              cache_status=$?
              set -e
              resolved_cache_root="$(resolve_model_root "$cache_name" "$dest" || true)"
              if [ "$cache_status" -eq 0 ] && [ -n "$resolved_cache_root" ]; then
                promote_model_root "$resolved_cache_root" "$dest"
                if model_dir_is_usable "$cache_name" "$dest"; then
                  echo "Restored ${cache_name} from xianzhef S3 cache."
                  date -u +"%Y-%m-%dT%H:%M:%SZ" > "$dest/.cache_complete"
                  return 0
                fi
              fi

              if ! command -v huggingface-cli >/dev/null 2>&1 && ! command -v hf >/dev/null 2>&1; then
                "$SERVER_PYTHON" -m pip install -q "huggingface_hub[cli]"
              fi
              echo "No usable S3 cache for ${cache_name}; downloading from Hugging Face repo ${repo}."
              hf_download "$repo" "$repo_type" "$dest"
              resolved_download_root="$(resolve_model_root "$cache_name" "$dest" || true)"
              if [ -n "$resolved_download_root" ]; then
                promote_model_root "$resolved_download_root" "$dest"
              fi
              if ! model_dir_is_usable "$cache_name" "$dest"; then
                echo "ERROR: downloaded ${cache_name}, but required files are missing." >&2
                find "$dest" -maxdepth 3 -type f | head -100 >&2
                exit 8
              fi
              date -u +"%Y-%m-%dT%H:%M:%SZ" > "$dest/.cache_complete"
            }

            echo "Downloading DreamZero code from ${CODE_S3_URI}/"
            osmo data download --resume "${CODE_S3_URI}/" /workspace/code/dreamzero
            CODE_ROOT="/workspace/code/dreamzero"
            LATEST_CODE_ROOT="${CODE_ROOT}/dreamzero_gripperfix_upload_latest"
            if [ -f "${LATEST_CODE_ROOT}/pyproject.toml" ]; then
              CODE_ROOT="$LATEST_CODE_ROOT"
            elif [ ! -f "$CODE_ROOT/pyproject.toml" ]; then
              found_pyproject="$(find /workspace/code -maxdepth 4 -name pyproject.toml -print | sort | tail -n 1)"
              if [ -n "$found_pyproject" ]; then
                CODE_ROOT="$(dirname "$found_pyproject")"
              fi
            fi
            test -f "$CODE_ROOT/pyproject.toml"

            python - <<'PY'
            from pathlib import Path

            code_root = Path("/workspace/code/dreamzero")
            latest_root = code_root / "dreamzero_gripperfix_upload_latest"
            if (latest_root / "pyproject.toml").is_file():
                code_root = latest_root
            else:
                matches = sorted(Path("/workspace/code").glob("**/pyproject.toml"))
                if matches:
                    code_root = matches[-1].parent

            server = code_root / "eval_utils/bimanual_policy_server.py"
            s = server.read_text()
            new_doc_marker = "Repeat all camera streams from the current observation"
            if new_doc_marker not in s:
                old_doc = (
                    '        Shared-global training uses ``global_condition_mode=current_repeat``:\n'
                    '        only the factored ``video_global`` scene stream is repeated from the\n'
                    '        current observation. Per-agent wrist streams remain normal temporal\n'
                    '        windows, matching ``BimanualDreamTransform._prepare_video``.\n'
                )
                new_doc = (
                    '        Shared-global training uses ``global_condition_mode=current_repeat``:\n'
                    '        frame 0 is the current observation and the action head uses frame 0\n'
                    '        for per-agent I2V conditioning whenever ``video_global`` is present.\n'
                    '        Repeat all camera streams from the current observation so the\n'
                    '        closed-loop path conditions on the same frame index as training.\n'
                    '        Legacy non-shared-global checkpoints keep the rolling history window.\n'
                )
                if old_doc in s:
                    s = s.replace(old_doc, new_doc, 1)
                old_block = (
                    '        if self._uses_shared_global():\n'
                    '            current_global = history[-1][0]\n'
                    '            global_history = np.repeat(\n'
                    '                current_global[None], self.num_frames, axis=0\n'
                    '            )\n'
                    '        return global_history, agent0_history, agent1_history\n'
                )
                new_block = (
                    '        if self._uses_shared_global():\n'
                    '            current_global, current_agent0, current_agent1 = history[-1]\n'
                    '            global_history = np.repeat(current_global[None], self.num_frames, axis=0)\n'
                    '            agent0_history = np.repeat(current_agent0[None], self.num_frames, axis=0)\n'
                    '            agent1_history = np.repeat(current_agent1[None], self.num_frames, axis=0)\n'
                    '        return global_history, agent0_history, agent1_history\n'
                )
                if old_block not in s:
                    raise SystemExit("did not find shared-global video window block to patch")
                s = s.replace(old_block, new_block, 1)
                compile(s, str(server), "exec")
                server.write_text(s)
                print("Patched shared-global eval video windows to repeat current frame for all streams.")

            s = server.read_text()
            if "def _metadata_tag(self)" not in s:
                s = s.replace(
                    '            self._transform = transforms["robofactory"]\n',
                    '            transform_tag = "robotwin" if "robotwin" in transforms else "robofactory"\n'
                    '            metadata_tag = self._metadata_tag()\n'
                    '            self._transform = transforms[transform_tag]\n',
                    1,
                )
                s = s.replace(
                    '            if "robofactory" in self._metadata:\n'
                    '                metadata = DatasetMetadata.model_validate(self._metadata["robofactory"])\n',
                    '            if metadata_tag is not None:\n'
                    '                metadata = DatasetMetadata.model_validate(self._metadata[metadata_tag])\n',
                    1,
                )
                s = s.replace(
                    "                    \"metadata.json lacks 'robofactory' key — transform will fail \"\n"
                    "                    \"on first infer(). Found keys: %s\",\n",
                    "                    \"metadata.json lacks 'robotwin' or legacy 'robofactory' key — \"\n"
                    "                    \"transform will fail on first infer(). Found keys: %s\",\n",
                    1,
                )
                s = s.replace(
                    '                "transforms.robofactory failed to instantiate — server will "\n',
                    '                "bimanual transforms failed to instantiate — server will "\n',
                    1,
                )
                session_marker = "    # ----- session bookkeeping ------------------------------------------\n"
                metadata_method = (
                    "    def _metadata_tag(self) -> str | None:\n"
                    "        if \"robotwin\" in self._metadata:\n"
                    "            return \"robotwin\"\n"
                    "        if \"robofactory\" in self._metadata:\n"
                    "            return \"robofactory\"\n"
                    "        return None\n\n"
                )
                if session_marker not in s:
                    raise SystemExit("did not find session bookkeeping marker for metadata tag patch")
                s = s.replace(session_marker, metadata_method + session_marker, 1)
                old_meta = (
                    '        emb_meta = (\n'
                    '            self._metadata.get("robofactory", {})\n'
                    '            .get("statistics", {})\n'
                    '            .get("action", {})\n'
                    '        )\n'
                )
                new_meta = (
                    '        metadata_tag = self._metadata_tag()\n'
                    '        emb_meta = {}\n'
                    '        if metadata_tag is not None:\n'
                    '            emb_meta = self._metadata[metadata_tag].get("statistics", {}).get("action", {})\n'
                )
                if old_meta not in s:
                    raise SystemExit("did not find robofactory action metadata block to patch")
                s = s.replace(old_meta, new_meta, 1)
                compile(s, str(server), "exec")
                server.write_text(s)
                print("Patched eval server to prefer robotwin metadata with robofactory fallback.")

            s = server.read_text()
            if 'candidates.add(f"state.{subkey}")' not in s:
                old_relative_key_block = (
                    '        if self._relative_action_keys:\n'
                    '            candidates = {subkey}\n'
                    '            if subkey.startswith("action."):\n'
                    '                candidates.add(subkey[len("action."):])\n'
                    '            else:\n'
                    '                candidates.add(f"action.{subkey}")\n'
                    '            return bool(candidates & self._relative_action_keys)\n'
                )
                new_relative_key_block = (
                    '        if self._relative_action_keys:\n'
                    '            candidates = {subkey}\n'
                    '            if subkey.startswith("action."):\n'
                    '                candidates.add(subkey[len("action."):])\n'
                    '            elif subkey.startswith("state."):\n'
                    '                candidates.add(subkey[len("state."):])\n'
                    '            else:\n'
                    '                candidates.add(f"action.{subkey}")\n'
                    '                candidates.add(f"state.{subkey}")\n'
                    '            return bool(candidates & self._relative_action_keys)\n'
                )
                if old_relative_key_block not in s:
                    raise SystemExit("did not find relative action key prefix block to patch")
                s = s.replace(old_relative_key_block, new_relative_key_block, 1)
                compile(s, str(server), "exec")
                server.write_text(s)
                print("Patched eval server relative action key matching for state./action. prefixes.")

            test_file = code_root / "tests/model/test_bimanual_policy_server.py"
            if test_file.is_file():
                t = test_file.read_text()
                t = t.replace(
                    "test_shared_global_video_window_repeats_only_global_stream",
                    "test_shared_global_video_window_repeats_current_frame_for_all_streams",
                )
                t = t.replace(
                    "np.testing.assert_array_equal(agent0_video[:, 0, 0, 0], [10, 11, 12])",
                    "np.testing.assert_array_equal(agent0_video[:, 0, 0, 0], [12, 12, 12])",
                )
                t = t.replace(
                    "np.testing.assert_array_equal(agent1_video[:, 0, 0, 0], [20, 21, 22])",
                    "np.testing.assert_array_equal(agent1_video[:, 0, 0, 0], [22, 22, 22])",
                )
                compile(t, str(test_file), "exec")
                test_file.write_text(t)
            PY

            require_code_marker() {
              local file="$1"
              shift
              local marker
              if [ ! -f "$CODE_ROOT/$file" ]; then
                echo "ERROR: expected code file missing: $file" >&2
                exit 7
              fi
              for marker in "$@"; do
                if ! grep -Fq "$marker" "$CODE_ROOT/$file"; then
                  echo "ERROR: code marker missing in $file: $marker" >&2
                  exit 7
                fi
              done
            }
            require_code_marker \
              eval_utils/bimanual_policy_server.py \
              "_set_eval_inference_transform_modes" \
              "_build_video_windows" \
              "Action summary session=" \
              "gripper_binarize_threshold"
            require_code_marker \
              tests/model/test_bimanual_policy_server.py \
              "test_shared_global_video_window_repeats_current_frame_for_all_streams"
                        require_code_marker \
                          eval_utils/bimanual_policy_server.py \
                          "Repeat all camera streams from the current observation"
                        require_code_marker \
                          eval_utils/bimanual_policy_server.py \
                          "def _metadata_tag" \
                          "robotwin"
            require_code_marker \
              groot/vla/data/dataset/lerobot.py \
              "_normalize_relative_action_key"
            require_code_marker \
              scripts/data/robotwin_to_lerobot_v2.py \
              "_validate_joint_action_vector"
            require_code_marker \
              tests/model/test_wan_action_head_multi_agent.py \
              "test_forward_multi_agent_shared_global_video_runs"
            echo "DreamZero code marker self-check passed."

