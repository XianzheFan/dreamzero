                print("Skipping gripper close patch because hold and force-open controls are disabled")
            elif "gripper_close_hold_steps" not in deploy_s:
                init_old = '        self.debug_interval = int(usr_args.get("debug_interval", 0))\n'
                init_new = init_old + (
                    '        self.gripper_close_hold_steps = int(usr_args.get(\n'
                    '            "gripper_close_hold_steps",\n'
                    '            os.environ.get("DREAMZERO_GRIPPER_CLOSE_HOLD_STEPS", "0"),\n'
                    '        ))\n'
                    '        if self.gripper_close_hold_steps < 0:\n'
                    '            raise ValueError("gripper_close_hold_steps must be >= 0")\n'
                    '        self.gripper_close_hold_min_infer = int(usr_args.get(\n'
                    '            "gripper_close_hold_min_infer",\n'
                    '            os.environ.get("DREAMZERO_GRIPPER_CLOSE_HOLD_MIN_INFER", "0"),\n'
                    '        ))\n'
                    '        if self.gripper_close_hold_min_infer < 0:\n'
                    '            raise ValueError("gripper_close_hold_min_infer must be >= 0")\n'
                    '        self.gripper_force_open_until_infer = int(usr_args.get(\n'
                    '            "gripper_force_open_until_infer",\n'
                    '            os.environ.get("DREAMZERO_GRIPPER_FORCE_OPEN_UNTIL_INFER", "0"),\n'
