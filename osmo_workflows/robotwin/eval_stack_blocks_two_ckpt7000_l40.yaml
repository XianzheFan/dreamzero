            configure_nvidia_graphics

            cd "$CODE_ROOT"
            echo "Launching DreamZero bimanual policy server for ${CKPT_SETTING}"
            CUDA_VISIBLE_DEVICES=0 "$SERVER_PYTHON" -m eval_utils.bimanual_policy_server \
              --ckpt-dir "$EVAL_CKPT_ROOT" \
              --ckpt-setting "$CKPT_SETTING" \
              --host 127.0.0.1 \
              --port "$PORT" \
              --image-h 240 \
              --image-w 320 \
              --num-frames 33 \
              --action-horizon 24 \
              --return-action-debug \
              --prompt-override "$DREAMZERO_PROMPT_OVERRIDE" \
              --gripper-binarize-threshold "$DREAMZERO_GRIPPER_BINARIZE_THRESHOLD" \
              --gripper-override "$DREAMZERO_GRIPPER_OVERRIDE" \
              --gripper-close-after-infer "$DREAMZERO_GRIPPER_CLOSE_AFTER_INFER" \
              --gripper-close-value "$DREAMZERO_GRIPPER_CLOSE_VALUE" \
              > /tmp/server.log 2>&1 &
            SERVER_PID=$!

            echo "Waiting for policy server pid=${SERVER_PID}"
            deadline=$((SECONDS + 3000))
            while true; do
              if grep -q "Bimanual policy server listening" /tmp/server.log 2>/dev/null; then
                echo "Policy server is ready"
                break
              fi
              if ! kill -0 "$SERVER_PID" 2>/dev/null; then
                echo "FATAL: server exited before listening. Last 120 server log lines:"
                tail -n 120 /tmp/server.log || true
                exit 1
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "FATAL: server did not become ready before timeout. Last 120 server log lines:"
                tail -n 120 /tmp/server.log || true
                exit 1
              fi
              tail -n 12 /tmp/server.log || true
              sleep 30
            done

            prepare_robotwin_runtime
            cd /workspace/robotwin
            export DREAMZERO_HOST=127.0.0.1
            export DREAMZERO_PORT="$PORT"
            export DREAMZERO_PROMPT_OVERRIDE
            export DREAMZERO_GRIPPER_BINARIZE_THRESHOLD
            export DREAMZERO_GRIPPER_CLOSE_HOLD_STEPS
            export DREAMZERO_GRIPPER_CLOSE_HOLD_MIN_INFER
            export DREAMZERO_GRIPPER_FORCE_OPEN_UNTIL_INFER
            export ROBOTWIN_EVAL_EPISODES="$NUM_EPISODES"
            export MUJOCO_GL=egl
            echo "Running RoboTwin closed-loop eval: task=${TASK_NAME}, config=${TASK_CONFIG}, episodes=${NUM_EPISODES}, seed=${SEED}, prompt_override=${DREAMZERO_PROMPT_OVERRIDE}, gripper_binarize_threshold=${DREAMZERO_GRIPPER_BINARIZE_THRESHOLD}, gripper_close_hold_steps=${DREAMZERO_GRIPPER_CLOSE_HOLD_STEPS}, gripper_close_hold_min_infer=${DREAMZERO_GRIPPER_CLOSE_HOLD_MIN_INFER}, gripper_force_open_until_infer=${DREAMZERO_GRIPPER_FORCE_OPEN_UNTIL_INFER}, client_timeout_seconds=${CLIENT_TIMEOUT_SECONDS}"
            set +e
            CLIENT_CMD=(
              "$ROBOTWIN_PYTHON" -u /workspace/robotwin/script/eval_policy.py
              --config /workspace/robotwin/policy/DreamZero/deploy_policy.yml
              --overrides
              --task_name "$TASK_NAME"
              --task_config "$TASK_CONFIG"
              --ckpt_setting "$CKPT_SETTING"
              --seed "$SEED"
              --policy_name DreamZero
              --server_host "$DREAMZERO_HOST"
              --server_port "$DREAMZERO_PORT"
              --action_mode auto
              --debug_interval 1
              --need_plan False
              --expert_check False
              --instruction_type unseen
            )
            if [ "${DREAMZERO_GRIPPER_CLOSE_HOLD_STEPS:-0}" -gt 0 ] 2>/dev/null; then
              CLIENT_CMD+=(--gripper_close_hold_steps "$DREAMZERO_GRIPPER_CLOSE_HOLD_STEPS")
              CLIENT_CMD+=(--gripper_close_hold_min_infer "$DREAMZERO_GRIPPER_CLOSE_HOLD_MIN_INFER")
            fi
            if [ "${DREAMZERO_GRIPPER_FORCE_OPEN_UNTIL_INFER:-0}" -gt 0 ] 2>/dev/null; then
              CLIENT_CMD+=(--gripper_force_open_until_infer "$DREAMZERO_GRIPPER_FORCE_OPEN_UNTIL_INFER")
            fi
            if command -v timeout >/dev/null 2>&1; then
              CUDA_VISIBLE_DEVICES=1 timeout "$CLIENT_TIMEOUT_SECONDS" "${CLIENT_CMD[@]}" > /tmp/client.log 2>&1
            else
              echo "WARNING: timeout command not found; running client without watchdog" >&2
              CUDA_VISIBLE_DEVICES=1 "${CLIENT_CMD[@]}" > /tmp/client.log 2>&1
            fi
            client_status=$?
            set -e

            echo "Client exit status: ${client_status}"
            if [ "$client_status" -eq 124 ]; then
              echo "Client timed out after ${CLIENT_TIMEOUT_SECONDS}s"
            fi
            echo "Last 240 client log lines:"
            tail -n 240 /tmp/client.log || true
            if [ "$client_status" -ne 0 ]; then
              exit "$client_status"
            fi

            cp -f /tmp/server.log /workspace/robotwin_eval_outputs/server.log
            cp -f /tmp/client.log /workspace/robotwin_eval_outputs/client.log
            find /workspace/robotwin/eval_result -type f | sort | sed -n '1,120p' | tee /workspace/robotwin_eval_outputs/result_files.txt
            find /workspace/robotwin/eval_result -name '_result.txt' -print -exec sed -n '1,120p' {} \; | tee /workspace/robotwin_eval_outputs/summary.txt

            echo "RoboTwin stack_blocks_two ${CKPT_SETTING} eval complete"

