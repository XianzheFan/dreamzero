            if gripper_hold_steps > 0 and "gripper_close_hold_steps" not in deploy_s:
                raise SystemExit("gripper close hold requested, but refreshed client lacks gripper_close_hold_steps")
            if gripper_force_open_until_infer > 0 and "gripper_force_open_until_infer" not in deploy_s:
                raise SystemExit("gripper force-open requested, but refreshed client lacks gripper_force_open_until_infer")

            p = Path("/workspace/robotwin/script/eval_policy.py")
