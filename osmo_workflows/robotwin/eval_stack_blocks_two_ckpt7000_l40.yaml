            download_or_restore_model "DreamZero-DROID" "GEAR-Dreams/DreamZero-DROID" "model" "$PRETRAINED_DIR"
            ln -sfn "$WAN_CKPT_DIR" /workspace/checkpoints/Wan2.1-I2V-14B-480P
            ln -sfn "$TOKENIZER_DIR" /workspace/checkpoints/umt5-xxl-tokenizer
            ln -sfn "$PRETRAINED_DIR" /workspace/checkpoints/DreamZero-DROID

            echo "Restoring eval checkpoint ${CKPT_SETTING}"
            restore_lock_dir="${EVAL_CKPT_ROOT}/${CKPT_SETTING}.restore.lock"
            restore_lock_acquired=0
            if [ ! -f "${EVAL_CKPT_ROOT}/${CKPT_SETTING}/model.safetensors" ]; then
              while true; do
                if [ -f "${EVAL_CKPT_ROOT}/${CKPT_SETTING}/model.safetensors" ]; then
                  echo "Eval checkpoint cache became available while waiting: ${EVAL_CKPT_ROOT}/${CKPT_SETTING}"
                  break
                fi
                if mkdir "$restore_lock_dir" 2>/dev/null; then
                  restore_lock_acquired=1
                  trap 'if [ "${restore_lock_acquired:-0}" = "1" ] && [ -n "${restore_lock_dir:-}" ]; then rm -rf "$restore_lock_dir"; fi' EXIT
                  echo "Acquired eval checkpoint restore lock: ${restore_lock_dir}"
                  break
                fi
                echo "Waiting for eval checkpoint cache lock: ${restore_lock_dir}"
                sleep 30
              done
            fi
            if [ "$restore_lock_acquired" = "1" ] && [ ! -f "${EVAL_CKPT_ROOT}/${CKPT_SETTING}/model.safetensors" ]; then
              restore_eval_checkpoint_from_uri() {
                local src_uri="$1"
                local import_dir="$2"
                rm -rf "$import_dir"
                mkdir -p "$import_dir"

                promote_imported_eval_checkpoint() {
                  local imported_dir="$1"
                  local label="$2"
                  local found_model
                  found_model="$(find "$imported_dir" -name model.safetensors -print -quit)"
                  if [ -z "$found_model" ]; then
                    echo "No model.safetensors found under ${label}." >&2
                    find "$imported_dir" -maxdepth 5 -type f | head -100 >&2
                    return 1
                  fi
                  local found_ckpt
                  found_ckpt="$(dirname "$found_model")"
                  mkdir -p "${EVAL_CKPT_ROOT}/${CKPT_SETTING}"
                  cp -an "${found_ckpt}/." "${EVAL_CKPT_ROOT}/${CKPT_SETTING}/"
                  echo "Restored eval checkpoint from ${label}"
                  return 0
                }

                local direct_idx=0
                local direct_uri
                for direct_uri in \
                  "${src_uri}/${SOURCE_TRAIN_RUN_NAME}/${CKPT_SETTING}" \
                  "${src_uri}/${CKPT_SETTING}"; do
                  direct_idx=$((direct_idx + 1))
                  local direct_import_dir="${import_dir}_direct_${direct_idx}"
                  rm -rf "$direct_import_dir"
                  mkdir -p "$direct_import_dir"
                  echo "Trying direct eval checkpoint path ${direct_uri}/"
                  set +e
                  osmo data download --resume "${direct_uri}/" "$direct_import_dir"
                  local direct_status=$?
                  set -e
                  if [ "$direct_status" -eq 0 ] && \
                     promote_imported_eval_checkpoint "$direct_import_dir" "$direct_uri/"; then
                    return 0
                  fi
                  echo "Direct checkpoint download from ${direct_uri}/ did not produce a usable model.safetensors." >&2
                done

                echo "Downloading eval checkpoint candidate from ${src_uri}/"
                local ckpt_regex
                ckpt_regex=".*${CKPT_SETTING}/(model\\.safetensors|config\\.json|trainer_state\\.json|wandb_config\\.json|latest|experiment_cfg/.*)$"
                set +e
                osmo data download --resume --regex "$ckpt_regex" "${src_uri}/" "$import_dir"
                local download_status=$?
                set -e
                if [ "$download_status" -ne 0 ]; then
                  echo "Checkpoint download from ${src_uri}/ failed with status=${download_status}." >&2
                  return 1
                fi
                promote_imported_eval_checkpoint "$import_dir" "${src_uri}/"
              }

              restore_eval_checkpoint_from_uri "$EVAL_CKPT_S3_URI" /workspace/eval_ckpts/import_primary || \
                restore_eval_checkpoint_from_uri "$EVAL_CKPT_FALLBACK_S3_URI" /workspace/eval_ckpts/import_fallback || {
                  echo "ERROR: did not find ${CKPT_SETTING}/model.safetensors in primary or fallback checkpoint locations." >&2
                  exit 9
                }
            fi
            if [ "$restore_lock_acquired" = "1" ]; then
              rm -rf "$restore_lock_dir"
              restore_lock_acquired=0
              trap - EXIT
            fi
            test -f "${EVAL_CKPT_ROOT}/${CKPT_SETTING}/model.safetensors"
            test -f "${EVAL_CKPT_ROOT}/${CKPT_SETTING}/experiment_cfg/conf.yaml"
            require_gripperfix_checkpoint_config() {
              local conf="${EVAL_CKPT_ROOT}/${CKPT_SETTING}/experiment_cfg/conf.yaml"
              for marker in \
                "gripper_clean_action_loss_weight: 2.0" \
                "gripper_clean_close_action_loss_weight: 4.0" \
                "gripper_clean_max_sigma: 0.75" \
                "action_prefix_loss_len: 8"; do
                if ! grep -Fq "$marker" "$conf"; then
                  echo "ERROR: eval checkpoint ${CKPT_SETTING} is missing gripperfix config marker: ${marker}" >&2
                  echo "Refusing to evaluate a stale or non-gripperfix checkpoint." >&2
                  exit 13
                fi
              done
              echo "Eval checkpoint gripperfix config self-check passed."
            }
            require_gripperfix_checkpoint_config
