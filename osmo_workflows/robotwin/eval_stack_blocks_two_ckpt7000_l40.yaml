                    '        return True\n'
                    '\n'
                    '    def _apply_gripper_close_hold(self, targets: list[np.ndarray]) -> None:\n'
                    '        if not targets:\n'
                    '            return\n'
                    '        if self._force_gripper_open_until_infer(targets):\n'
                    '            return\n'
                    '        if self.gripper_close_hold_steps <= 0:\n'
                    '            return\n'
                    '        if self._infer_count < self.gripper_close_hold_min_infer:\n'
                    '            return\n'
                    '        grippers = np.asarray([[target[7], target[15]] for target in targets], dtype=np.float32)\n'
                    '        close_seen = grippers < 0.5\n'
                    '        for arm_idx, dim in enumerate((7, 15)):\n'
                    '            if self._gripper_hold_remaining[arm_idx] > 0:\n'
                    '                for target in targets:\n'
                    '                    target[dim] = 0.0\n'
                    '                self._gripper_hold_remaining[arm_idx] = max(\n'
                    '                    0, int(self._gripper_hold_remaining[arm_idx]) - len(targets)\n'
                    '                )\n'
                    '            if close_seen[:, arm_idx].any():\n'
                    '                start = int(np.argmax(close_seen[:, arm_idx]))\n'
                    '                for target in targets[start:]:\n'
                    '                    target[dim] = 0.0\n'
                    '                remaining = int(self.gripper_close_hold_steps) - (len(targets) - start)\n'
                    '                self._gripper_hold_remaining[arm_idx] = max(\n'
                    '                    int(self._gripper_hold_remaining[arm_idx]), remaining\n'
                    '                )\n'
                    '\n'
                )
                if method_anchor not in deploy_s:
                    raise SystemExit("did not find _as_abs_action_chunk anchor for gripper hold patch")
                deploy_s = deploy_s.replace(method_anchor, hold_method + method_anchor, 1)

                abs_old = (
                    '            for target in targets:\n'
                    '                self._clip_target_inplace(target)\n'
                    '            return targets\n'
                )
                abs_new = (
                    '            for target in targets:\n'
                    '                self._clip_target_inplace(target)\n'
                    '            self._apply_gripper_close_hold(targets)\n'
                    '            return targets\n'
                )
                if abs_old not in deploy_s:
                    raise SystemExit("did not find absolute target return block for gripper hold patch")
                deploy_s = deploy_s.replace(abs_old, abs_new, 1)

                delta_old = (
                    '            targets.append(target.astype(np.float32, copy=True))\n'
                    '            cur = target\n'
                    '        return targets\n'
                )
                delta_new = (
                    '            targets.append(target.astype(np.float32, copy=True))\n'
                    '            cur = target\n'
                    '        self._apply_gripper_close_hold(targets)\n'
                    '        return targets\n'
                )
                if delta_old not in deploy_s:
                    raise SystemExit("did not find delta target return block for gripper hold patch")
                deploy_s = deploy_s.replace(delta_old, delta_new, 1)

                debug_old = (
                    '            f"grip=({targets[0][7]:.3f},{targets[0][15]:.3f}) "\n'
                )
                debug_new = debug_old + (
                    '            f"hold=({int(self._gripper_hold_remaining[0])},{int(self._gripper_hold_remaining[1])})/"\n'
                    '            f"{self.gripper_close_hold_steps} "\n'
                )
