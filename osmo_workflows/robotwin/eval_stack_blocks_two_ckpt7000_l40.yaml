              cp -f /workspace/robotwin_client_refresh/policy/DreamZero/deploy_policy.yml \
                /workspace/robotwin/policy/DreamZero/deploy_policy.yml
            else
              echo "ERROR: did not refresh RoboTwin DreamZero deploy policy from ${ROBOTWIN_S3_URI}" >&2
              exit 12
            fi
            python - <<'PY'
            import os
            from pathlib import Path

            deploy = Path("/workspace/robotwin/policy/DreamZero/deploy_policy.py")
            deploy_s = deploy.read_text()
            for marker in ("action_representation", "_resolved_action_mode", "absolute_qpos"):
                if marker not in deploy_s:
