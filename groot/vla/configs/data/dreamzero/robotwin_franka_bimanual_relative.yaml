# @package _global_

# RoboTwin Franka/Panda bimanual training config.
#
# RoboTwin's dual Franka/Panda demonstrations are converted to the same
# LeRobot v2 tensor layout used by the two-Panda RoboFactory data:
#   state/action = [left 7 joints, left gripper, right 7 joints, right gripper]
# The converter therefore writes ``embodiment_tag: robofactory`` so the
# existing Panda modality config and transforms can be reused exactly.
#
# Required CLI overrides:
#   data=dreamzero/robotwin_franka_bimanual_relative
#   model/dreamzero/transform=bimanual_cotrain
#   robotwin_data_root=/path/to/converted/lerobot_v2/beat_block_hammer-rt

defaults:
  - dreamzero/base_48_wan_fine_aug_relative
  - _self_

max_state_dim: 64
use_global_metadata: false
relative_action: false
relative_action_per_horizon: false
relative_action_keys: []
max_chunk_size: 5
dataset_shard_sampling_rate: 0.1
mixture_dataset_cls: groot.vla.data.dataset.lerobot_sharded.ShardedLeRobotMixtureDataset.from_mixture_spec
single_dataset_cls: groot.vla.data.dataset.lerobot_sharded.ShardedLeRobotSubLangSingleActionChunkDatasetDROID

robotwin_data_root: ???

train_dataset:
  _target_: ${mixture_dataset_cls}
  _convert_: object
  mixture_spec:
    - dataset_path:
        robofactory:
          - ${robotwin_data_root}
      dataset_weight: 1.0
      distribute_weights: true

  dataset_class: ${single_dataset_cls}
  all_modality_configs: ${modality_configs}
  all_transforms: ${transforms}
  metadata_versions: ${metadata_versions}
  fps: ${fps}
  dataset_kwargs:
    video_backend: decord
    use_global_metadata: ${use_global_metadata}
    max_chunk_size: ${max_chunk_size}
    relative_action: ${relative_action}
    relative_action_keys: ${relative_action_keys}
    relative_action_per_horizon: ${relative_action_per_horizon}
  mixture_kwargs:
    training: true
    balance_dataset_weights: false
    seed: 42
    shard_sampling_rate: ${dataset_shard_sampling_rate}

# Video key order in modality_config_robofactory.video.modality_keys:
#   0 = head/global camera, 1 = left wrist camera, 2 = right wrist camera.
# Each agent conditions on the shared scene view plus its own wrist view.
agent_video_views: [[0, 1], [0, 2]]
agent_state_dims: [[0, 8], [8, 16]]
agent_action_dims: [[0, 8], [8, 16]]
