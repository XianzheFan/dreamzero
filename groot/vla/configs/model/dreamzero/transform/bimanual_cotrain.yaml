# @package _global_

# Multi-agent model_specific_transform. Wraps DreamTransform and adds a
# leading agent axis P to state/action/images. The agent split is
# user-configurable -- defaults below match YAM bimanual.

defaults:
  - dreamzero_cotrain
  - _self_  # this file overrides dreamzero_cotrain

# YAM defaults: 2 agents (left arm, right arm), 3 cameras
# (top=0, left_wrist=1, right_wrist=2).
agent_video_views: [[0, 1], [0, 2]]  # each agent: [top_shared, own_wrist]
agent_state_dims: [[0, 7], [7, 14]]   # raw state 14-dim split 7+7
agent_action_dims: [[0, 7], [7, 14]]  # raw action 14-dim split 7+7

model_specific_transform:
  _target_: groot.vla.model.dreamzero.transform.bimanual_cotrain.BimanualDreamTransform
  default_instruction: "Perform the default behavior."
  language_dropout_prob: ${language_dropout_prob}
  always_use_default_instruction: false
  max_state_dim: ${max_state_dim}
  max_action_dim: ${max_action_dim}
  max_length: ${max_length}
  state_horizon: ${state_horizon}
  action_horizon: ${action_horizon}
  embodiment_tag_mapping: ${embodiment_tag_to_projector_index}
  tokenizer_path: ${tokenizer_path}
  agent_video_views: ${agent_video_views}
  agent_state_dims: ${agent_state_dims}
  agent_action_dims: ${agent_action_dims}
